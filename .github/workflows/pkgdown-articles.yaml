on:
  push:
    branches: [main]
    paths:
      - 'vignettes/**'
      - 'man/figures/**'

name: pkgdown-articles

permissions:
  contents: write

jobs:
  pkgdown-articles:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::roxygen2
          needs: website

      - name: Generate documentation
        run: roxygen2::roxygenise(".")
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL .

      - name: Restore previous site from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: docs

      - name: Build changed articles only
        run: |
          # Find changed Rmd files
          changed <- system("git diff --name-only HEAD~1 -- vignettes/", intern = TRUE)
          rmds <- grep("\\.Rmd$", changed, value = TRUE)

          # Find changed figures
          figs <- system("git diff --name-only HEAD~1 -- man/figures/", intern = TRUE)

          cat("Changed Rmds:", rmds, "\n")
          cat("Changed figures:", figs, "\n")

          # Copy figures to docs/
          if (length(figs) > 0) {
            dir.create("docs/reference/figures", recursive = TRUE, showWarnings = FALSE)
            for (f in figs) {
              dest <- file.path("docs/reference/figures", basename(f))
              file.copy(f, dest, overwrite = TRUE)
              cat("  Copied", f, "->", dest, "\n")
            }
          }

          # Build each changed article
          if (length(rmds) > 0) {
            for (rmd in rmds) {
              # vignettes/articles/foo.Rmd -> articles/foo
              name <- sub("\\.Rmd$", "", sub("^vignettes/", "", rmd))
              cat("Building article:", name, "\n")
              tryCatch(
                pkgdown::build_article(name, pkg = "."),
                error = function(e) {
                  cat("  ERROR building", name, ":", conditionMessage(e), "\n")
                  stop(e)
                }
              )
            }
          }

          # Rebuild home page if index.md or learn.Rmd changed
          home_changed <- any(grepl("index\\.md|learn\\.Rmd", c(rmds, changed)))
          if (home_changed) {
            cat("Rebuilding home page\n")
            pkgdown::build_home(pkg = ".")
          }

          # Always rebuild article index (lightweight)
          pkgdown::build_redirects(pkg = ".")

          if (length(rmds) == 0 && length(figs) == 0) {
            cat("No articles or figures changed — nothing to build\n")
          }
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
