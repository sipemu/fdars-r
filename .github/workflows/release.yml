name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.config.type }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, type: 'macOS', r-version: 'release'}
          - {os: windows-latest, type: 'Windows', r-version: 'release'}

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r-version }}

      - name: Install Rust GNU Toolchain (Windows)
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::roxygen2
          needs: check

      - name: Build Binary Package
        run: |
          roxygen2::roxygenize()
          out_dir <- normalizePath(file.path(getwd(), "pkg_output"))
          dir.create(out_dir, showWarnings = FALSE)
          pkg_path <- devtools::build(binary = TRUE, path = out_dir, args = c("--no-build-vignettes"))
          cat("Built:", pkg_path, "\n")
        shell: Rscript {0}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdars-${{ matrix.config.type }}
          path: pkg_output/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            *.zip
          body: |
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Installation

            **Windows / macOS (no Rust needed):**
            Download the attached `.zip` (Windows) or `.tgz` (macOS) file and install:
            ```r
            install.packages("path/to/fdars_x.y.z.zip", repos = NULL, type = "win.binary")  # Windows
            install.packages("path/to/fdars_x.y.z.tgz", repos = NULL, type = "mac.binary")  # macOS
            ```

            **From source (Linux/any platform with Rust):**
            ```r
            devtools::install_github("${{ github.repository }}")
            ```
          draft: false
          prerelease: false
