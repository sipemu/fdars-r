name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: R-CMD-check (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: windows-latest, r: 'release'}

    steps:
      - uses: actions/checkout@v4

      - name: Set up R ${{ matrix.config.r }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          check-dir: '"check"'

      - name: Check for prohibited symbols (CRAN compliance)
        if: runner.os != 'Windows'
        run: |
          SO_FILE=$(find check -name "fdars.so" -o -name "fdars.dylib" 2>/dev/null | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "Shared library not found in check dir, skipping symbol check"
            exit 0
          fi
          echo "Scanning $SO_FILE for prohibited symbols..."
          FOUND=$(nm -g "$SO_FILE" 2>/dev/null | grep -E " T _(abort|exit|_exit|printf|puts)$| T (abort|exit|_exit|printf|puts)$" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::CRAN prohibited symbols found in shared library:"
            echo "$FOUND"
            exit 1
          fi
          echo "No prohibited symbols found - CRAN compliant"

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          covr::codecov(
            path = ".",
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
