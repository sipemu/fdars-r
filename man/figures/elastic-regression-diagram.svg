<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrER" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="27.5" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Elastic Regression: Joint Alignment + Prediction</text>
  <text x="300" y="50" text-anchor="middle" font-size="12.5" fill="#888">y&#7522; = &#945; + &#x222B; &#946;(t) f&#7522;(&#947;&#7522;(t)) dt    (alignment and &#946; jointly optimized)</text>

  <!-- ===== Step 1: Misaligned X(t) ===== -->
  <rect x="14" y="67.5" width="120" height="125" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.3"/>
  <text x="74" y="90" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#2C5F8A">X&#7522;(t)</text>
  <text x="74" y="105" text-anchor="middle" font-size="10" fill="#888">misaligned curves</text>
  <!-- Shifted curves -->
  <path d="M 24 150.0 Q 40 117.5 56 135.0 Q 72 152.5 88 125.0 Q 104 97.5 120 135.0" stroke="#4A90D9" stroke-width="1.3" fill="none" opacity="0.4"/>
  <path d="M 24 145.0 Q 34 115.0 48 127.5 Q 62 140.0 78 115.0 Q 94 90.0 110 125.0 Q 124 150.0 124 140.0" stroke="#D55E00" stroke-width="1.3" fill="none" opacity="0.4"/>
  <path d="M 24 155.0 Q 44 117.5 60 137.5 Q 76 157.5 92 130.0 Q 108 102.5 124 140.0" stroke="#7B2D8E" stroke-width="1.3" fill="none" opacity="0.3"/>

  <!-- Arrow: iterative -->
  <line x1="138" y1="130" x2="162" y2="130" stroke="#555" stroke-width="1.3" marker-end="u r l a r r E R"/>
  <text x="150" y="117.5" text-anchor="middle" font-size="8.8" fill="#888">iterate</text>

  <!-- ===== Step 2: Align + estimate beta ===== -->
  <rect x="168" y="67.5" width="132" height="125" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3"/>
  <text x="234" y="90" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#B37700">Joint Optimization</text>

  <!-- Two-row layout: align then regress -->
  <text x="182" y="115" font-size="10" fill="#555">1. Align to &#947;&#7522;(t)</text>
  <!-- Mini warps -->
  <line x1="182" y1="125" x2="220" y2="125" stroke="#ccc" stroke-width="0.5" stroke-dasharray="2,1"/>
  <path d="M 182 137.5 Q 194 130.0 206 125.0 Q 218 122.5 224 120.0" stroke="#E6A020" stroke-width="1.1" fill="none" opacity="0.6"/>
  <path d="M 182 135.0 Q 196 132.5 210 127.5 Q 220 125.0 224 122.5" stroke="#E6A020" stroke-width="1.1" fill="none" opacity="0.4"/>

  <text x="232" y="115" font-size="10" fill="#555">2. Estimate &#946;(t)</text>
  <!-- Mini beta -->
  <path d="M 240 137.5 Q 254 112.5 268 106.2 Q 282 102.5 290 118.8" stroke="#2E8B57" stroke-width="2.1" fill="none"/>

  <text x="234" y="167.5" text-anchor="middle" font-size="10" fill="#B37700">Repeat until convergence</text>
  <!-- Circular arrow -->
  <path d="M 210 175.0 Q 234 185.0 258 175.0" stroke="#B37700" stroke-width="0.9" fill="none" marker-end="u r l a r r E R" opacity="0.5"/>

  <!-- Arrow to right -->
  <line x1="304" y1="130" x2="328" y2="130" stroke="#555" stroke-width="1.3" marker-end="u r l a r r E R"/>

  <!-- ===== Step 3: Result ===== -->
  <rect x="334" y="67.5" width="252" height="125" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="460" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E8B57">Results</text>

  <!-- Beta coefficient -->
  <path d="M 348 140.0 Q 368 107.5 388 100.0 Q 408 95.0 428 110.0 Q 448 125.0 460 115.0" stroke="#2E8B57" stroke-width="2.7" fill="none"/>
  <text x="400" y="160" text-anchor="middle" font-size="10" fill="#2E8B57" font-weight="bold">&#946;(t)</text>

  <!-- Scatter: observed vs fitted -->
  <circle cx="490" cy="112.5" r="2.5" fill="#E6A020" opacity="0.6"/>
  <circle cx="500" cy="120" r="2.5" fill="#E6A020" opacity="0.6"/>
  <circle cx="510" cy="127.5" r="2.5" fill="#E6A020" opacity="0.6"/>
  <circle cx="520" cy="137.5" r="2.5" fill="#E6A020" opacity="0.6"/>
  <circle cx="530" cy="145" r="2.5" fill="#E6A020" opacity="0.6"/>
  <circle cx="540" cy="152.5" r="2.5" fill="#E6A020" opacity="0.6"/>
  <circle cx="550" cy="162.5" r="2.5" fill="#E6A020" opacity="0.6"/>
  <!-- 45-degree line -->
  <line x1="482" y1="105" x2="560" y2="170" stroke="#999" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="530" y="180" text-anchor="middle" font-size="8.8" fill="#888">y vs &#375;</text>

  <!-- ===== BOTTOM: Three methods ===== -->
  <line x1="10" y1="212.5" x2="590" y2="212.5" stroke="#eee" stroke-width="1.1"/>
  <text x="300" y="237.5" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#555">Three Elastic Regression Methods</text>

  <!-- elastic.regression -->
  <rect x="14" y="252.5" width="180" height="125" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.3"/>
  <text x="104" y="277.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C5F8A">elastic.regression</text>
  <text x="104" y="297.5" text-anchor="middle" font-size="10" fill="#555">Scalar-on-function with</text>
  <text x="104" y="312.5" text-anchor="middle" font-size="10" fill="#555">basis expansion of &#946;(t)</text>
  <text x="104" y="335" text-anchor="middle" font-size="10" fill="#888">y&#7522; = &#945; + &#x222B; &#946;(t) f&#7522;(&#947;&#7522;) dt</text>
  <text x="104" y="357.5" text-anchor="middle" font-size="10" fill="#2C5F8A">Continuous response</text>

  <!-- elastic.logistic -->
  <rect x="210" y="252.5" width="180" height="125" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3"/>
  <text x="300" y="277.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B37700">elastic.logistic</text>
  <text x="300" y="297.5" text-anchor="middle" font-size="10" fill="#555">Logistic classification</text>
  <text x="300" y="312.5" text-anchor="middle" font-size="10" fill="#555">with elastic alignment</text>
  <text x="300" y="335" text-anchor="middle" font-size="10" fill="#888">P(y=1) = logit(&#945; + &#x222B; &#946; f&#7522; &#947;&#7522;)</text>
  <text x="300" y="357.5" text-anchor="middle" font-size="10" fill="#B37700">Binary response</text>

  <!-- elastic.pcr -->
  <rect x="406" y="252.5" width="180" height="125" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.3"/>
  <text x="496" y="277.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7B2D8E">elastic.pcr</text>
  <text x="496" y="297.5" text-anchor="middle" font-size="10" fill="#555">Principal component</text>
  <text x="496" y="312.5" text-anchor="middle" font-size="10" fill="#555">regression on elastic scores</text>
  <text x="496" y="335" text-anchor="middle" font-size="10" fill="#888">y&#7522; = &#945; + &#x2211; &#946;&#8342; &#958;&#8342;&#7522;</text>
  <text x="496" y="357.5" text-anchor="middle" font-size="10" fill="#7B2D8E">vert / horiz / joint scores</text>
</svg>
