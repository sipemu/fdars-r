<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <rect width="200" height="120" rx="4" fill="#f5f5f5"/>
  <!-- UCL line (red dashed) -->
  <line x1="15" y1="30" x2="185" y2="30" stroke="#DC3545" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- CUSUM step function -->
  <polyline points="15,100 35,100 35,88 55,88 55,78 70,78 70,65 85,65 85,55 100,55 100,45 115,45 115,38 130,38 130,30 145,30"
    fill="none" stroke="#4169E1" stroke-width="2" stroke-linejoin="round"/>
  <!-- Alarm dot -->
  <circle cx="145" cy="30" r="4" fill="#DC3545"/>
  <!-- Continuation after alarm -->
  <polyline points="145,30 160,28 175,25 185,22"
    fill="none" stroke="#4169E1" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3,3"/>
</svg>