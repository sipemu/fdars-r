<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="27.5" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Karhunen-Lo&#232;ve Decomposition</text>
  <text x="300" y="50" text-anchor="middle" font-size="12.5" fill="#888">X(t) = &#956;(t) + &#958;&#8321;&#966;&#8321;(t) + &#958;&#8322;&#966;&#8322;(t) + &#8230;</text>

  <!-- ===== X(t) observed curve ===== -->
  <rect x="14" y="70" width="110" height="125" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.3"/>
  <text x="69" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C5F8A">X(t)</text>
  <text x="69" y="105" text-anchor="middle" font-size="10" fill="#888">observed curve</text>
  <!-- Stylized curve -->
  <path d="M 26 162.5 Q 38 122.5 50 137.5 Q 62 152.5 74 125.0 Q 86 97.5 98 131.2 Q 110 165.0 112 150.0" stroke="#4A90D9" stroke-width="2.1" fill="none"/>

  <!-- = sign -->
  <text x="138" y="140" text-anchor="middle" font-size="22.5" fill="#555">=</text>

  <!-- ===== mu(t) mean function ===== -->
  <rect x="152" y="70" width="90" height="125" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.3"/>
  <text x="197" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E8B57">&#956;(t)</text>
  <text x="197" y="105" text-anchor="middle" font-size="10" fill="#888">mean function</text>
  <!-- Smooth mean curve -->
  <path d="M 164 162.5 Q 176 135.0 188 140.0 Q 200 145.0 212 135.0 Q 224 125.0 230 137.5" stroke="#2E8B57" stroke-width="2.1" fill="none"/>

  <!-- + sign -->
  <text x="255" y="140" text-anchor="middle" font-size="22.5" fill="#555">+</text>

  <!-- ===== xi1 * phi1(t) PC1 ===== -->
  <rect x="268" y="70" width="90" height="125" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3"/>
  <text x="313" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B37700">&#958;&#8321;&#966;&#8321;(t)</text>
  <text x="313" y="105" text-anchor="middle" font-size="10" fill="#888">PC 1 (dominant)</text>
  <!-- Eigenfunction 1: one broad hump -->
  <path d="M 280 156.2 Q 296 118.8 313 118.8 Q 330 118.8 346 156.2" stroke="#E6A020" stroke-width="2.1" fill="none"/>
  <!-- Score annotation -->
  <rect x="284" y="170" width="58" height="17.5" rx="3" fill="#E6A020" opacity="0.15"/>
  <text x="313" y="183.8" text-anchor="middle" font-size="10" fill="#B37700">&#958;&#8321; = score</text>

  <!-- + sign -->
  <text x="371" y="140" text-anchor="middle" font-size="22.5" fill="#555">+</text>

  <!-- ===== xi2 * phi2(t) PC2 ===== -->
  <rect x="384" y="70" width="90" height="125" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.3"/>
  <text x="429" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7B2D8E">&#958;&#8322;&#966;&#8322;(t)</text>
  <text x="429" y="105" text-anchor="middle" font-size="10" fill="#888">PC 2</text>
  <!-- Eigenfunction 2: S-shaped (one cycle) -->
  <path d="M 396 143.8 Q 408 118.8 420 143.8 Q 432 168.8 444 143.8 Q 456 118.8 462 143.8" stroke="#7B2D8E" stroke-width="2.1" fill="none"/>
  <rect x="400" y="170" width="58" height="17.5" rx="3" fill="#7B2D8E" opacity="0.15"/>
  <text x="429" y="183.8" text-anchor="middle" font-size="10" fill="#7B2D8E">&#958;&#8322; = score</text>

  <!-- + ... -->
  <text x="490" y="140" text-anchor="middle" font-size="17.5" fill="#999">+ &#8230;</text>

  <!-- ===== VARIANCE BAR ===== -->
  <text x="300" y="240" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#555">Variance Explained</text>

  <!-- Total bar background -->
  <rect x="80" y="250" width="440" height="30" rx="4" fill="#eee" stroke="#ccc" stroke-width="0.9"/>
  <!-- PC1 portion (large) -->
  <rect x="80" y="250" width="264" height="30" rx="4" fill="#E6A020" opacity="0.5"/>
  <text x="212" y="270" text-anchor="middle" font-size="11.2" fill="#B37700" font-weight="bold">&#955;&#8321; (60%)</text>
  <!-- PC2 portion -->
  <rect x="344" y="250" width="88" height="30" rx="0" fill="#7B2D8E" opacity="0.35"/>
  <text x="388" y="270" text-anchor="middle" font-size="11.2" fill="#7B2D8E" font-weight="bold">&#955;&#8322; (20%)</text>
  <!-- PC3+ portion -->
  <rect x="432" y="250" width="44" height="30" rx="0" fill="#999" opacity="0.2"/>
  <text x="454" y="270" text-anchor="middle" font-size="10" fill="#888">&#955;&#8323;&#8230;</text>
  <!-- Right cap -->
  <rect x="476" y="250" width="44" height="30" rx="4" fill="#ddd" opacity="0.3"/>
  <text x="498" y="270" text-anchor="middle" font-size="10" fill="#aaa">rest</text>

  <!-- ===== BOTTOM: Key properties ===== -->
  <line x1="10" y1="300" x2="590" y2="300" stroke="#eee" stroke-width="1.1"/>

  <rect x="30" y="315" width="160" height="62.5" rx="5" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.1"/>
  <text x="110" y="337.5" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#2E8B57">Eigenfunctions &#966;&#8342;(t)</text>
  <text x="110" y="355" text-anchor="middle" font-size="10" fill="#555">Orthonormal modes of</text>
  <text x="110" y="370" text-anchor="middle" font-size="10" fill="#555">variation in curve shape</text>

  <rect x="220" y="315" width="160" height="62.5" rx="5" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.1"/>
  <text x="300" y="337.5" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#B37700">Scores &#958;&#8342;</text>
  <text x="300" y="355" text-anchor="middle" font-size="10" fill="#555">Per-curve weights; how</text>
  <text x="300" y="370" text-anchor="middle" font-size="10" fill="#555">much of each mode</text>

  <rect x="410" y="315" width="160" height="62.5" rx="5" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.1"/>
  <text x="490" y="337.5" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#7B2D8E">Eigenvalues &#955;&#8342;</text>
  <text x="490" y="355" text-anchor="middle" font-size="10" fill="#555">Variance captured;</text>
  <text x="490" y="370" text-anchor="middle" font-size="10" fill="#555">&#955;&#8321; &#8805; &#955;&#8322; &#8805; &#8230; &#8805; 0</text>
</svg>
