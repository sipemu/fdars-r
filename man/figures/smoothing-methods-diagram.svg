<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrS" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Four Smoothing Methods in fdars</text>
  <text x="350" y="54" text-anchor="middle" font-size="14" fill="#888">Noisy observations &#8594; smooth functional data object</text>

  <!-- Input: noisy observations -->
  <rect x="24" y="110" width="120" height="140" rx="8" fill="#F8F8F8" stroke="#888" stroke-width="1.5"/>
  <text x="84" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">Noisy data</text>
  <!-- scattered dots -->
  <circle cx="42" cy="168" r="3" fill="#999" opacity="0.6"/>
  <circle cx="56" cy="158" r="3" fill="#999" opacity="0.6"/>
  <circle cx="70" cy="172" r="3" fill="#999" opacity="0.6"/>
  <circle cx="84" cy="152" r="3" fill="#999" opacity="0.6"/>
  <circle cx="98" cy="178" r="3" fill="#999" opacity="0.6"/>
  <circle cx="112" cy="162" r="3" fill="#999" opacity="0.6"/>
  <circle cx="48" cy="194" r="3" fill="#999" opacity="0.6"/>
  <circle cx="66" cy="206" r="3" fill="#999" opacity="0.6"/>
  <circle cx="84" cy="190" r="3" fill="#999" opacity="0.6"/>
  <circle cx="102" cy="210" r="3" fill="#999" opacity="0.6"/>
  <circle cx="118" cy="198" r="3" fill="#999" opacity="0.6"/>

  <!-- Arrows to methods -->
  <line x1="148" y1="145" x2="198" y2="105" stroke="#555" stroke-width="1.2" marker-end="url(#arrS)"/>
  <line x1="148" y1="165" x2="198" y2="188" stroke="#555" stroke-width="1.2" marker-end="url(#arrS)"/>
  <line x1="148" y1="195" x2="198" y2="270" stroke="#555" stroke-width="1.2" marker-end="url(#arrS)"/>
  <line x1="148" y1="215" x2="198" y2="350" stroke="#555" stroke-width="1.2" marker-end="url(#arrS)"/>

  <!-- Method 1: P-spline -->
  <rect x="204" y="76" width="200" height="72" rx="8" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="304" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C5F8A">P-spline Smoothing</text>
  <text x="304" y="120" text-anchor="middle" font-size="13" fill="#555">pspline()</text>
  <text x="304" y="138" text-anchor="middle" font-size="12" fill="#888">Auto penalty, works out of the box</text>

  <!-- Method 2: Kernel -->
  <rect x="204" y="160" width="200" height="72" rx="8" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.5"/>
  <text x="304" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#B37700">Kernel Smoothers</text>
  <text x="304" y="204" text-anchor="middle" font-size="13" fill="#555">S.NW() / S.LLR()</text>
  <text x="304" y="222" text-anchor="middle" font-size="12" fill="#888">Bandwidth h, nonparametric</text>

  <!-- Method 3: Basis Expansion -->
  <rect x="204" y="244" width="200" height="72" rx="8" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="304" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E8B57">Basis Expansion</text>
  <text x="304" y="288" text-anchor="middle" font-size="13" fill="#555">fdata2basis()</text>
  <text x="304" y="306" text-anchor="middle" font-size="12" fill="#888">B-spline or Fourier basis</text>

  <!-- Method 4: Penalized Basis -->
  <rect x="204" y="328" width="200" height="72" rx="8" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.5"/>
  <text x="304" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#7B2D8E">Penalized Basis</text>
  <text x="304" y="372" text-anchor="middle" font-size="13" fill="#555">smooth.basis.gcv()</text>
  <text x="304" y="390" text-anchor="middle" font-size="12" fill="#888">GCV-optimal roughness penalty</text>

  <!-- Arrows to output -->
  <line x1="408" y1="112" x2="480" y2="195" stroke="#555" stroke-width="1.2" marker-end="url(#arrS)"/>
  <line x1="408" y1="196" x2="480" y2="200" stroke="#555" stroke-width="1.2" marker-end="url(#arrS)"/>
  <line x1="408" y1="280" x2="480" y2="210" stroke="#555" stroke-width="1.2" marker-end="url(#arrS)"/>
  <line x1="408" y1="364" x2="480" y2="220" stroke="#555" stroke-width="1.2" marker-end="url(#arrS)"/>

  <!-- Output: smooth fdata -->
  <rect x="486" y="130" width="190" height="160" rx="8" fill="#F0FAF0" stroke="#2E8B57" stroke-width="2"/>
  <text x="581" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E8B57">Smooth fdata</text>
  <text x="581" y="178" text-anchor="middle" font-size="13" fill="#888">Ready for analysis</text>

  <!-- Smooth curves -->
  <path d="M504 210 Q526 192 548 202 Q570 212 592 198 Q614 184 636 194 Q658 204 664 200" stroke="#4A90D9" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M504 226 Q526 208 548 218 Q570 228 592 214 Q614 200 636 210 Q658 220 664 216" stroke="#E6A020" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M504 242 Q526 224 548 234 Q570 244 592 230 Q614 216 636 226 Q658 236 664 232" stroke="#2E8B57" stroke-width="2" fill="none" opacity="0.5"/>

  <text x="581" y="270" text-anchor="middle" font-size="12" fill="#888">derivatives, FPCA,</text>
  <text x="581" y="286" text-anchor="middle" font-size="12" fill="#888">regression, ...</text>
</svg>
