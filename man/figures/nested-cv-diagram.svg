<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arrowD" markerWidth="6" markerHeight="8" refX="3" refY="7" orient="auto">
      <path d="M0,0 L3,8 L6,0" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="27.5" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Nested Cross-Validation</text>

  <!-- ===== OUTER FOLD 1 ===== -->
  <!-- test = fold 1, train = folds 2-5 -->
  <rect x="10" y="45" width="580" height="112.5" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.6"/>
  <text x="24" y="67.5" font-size="13.8" font-weight="bold" fill="#2C5F8A">Outer fold 1</text>

  <!-- Data blocks -->
  <rect x="24" y="77.5" width="90" height="22.5" rx="3" fill="#D55E00" opacity="0.25" stroke="#D55E00" stroke-width="1.1"/>
  <text x="69" y="93.8" text-anchor="middle" font-size="11.2" fill="#D55E00" font-weight="bold">Fold 1 (test)</text>
  <rect x="120" y="77.5" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="165" y="93.8" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 2</text>
  <rect x="216" y="77.5" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="261" y="93.8" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 3</text>
  <rect x="312" y="77.5" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="357" y="93.8" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 4</text>
  <rect x="408" y="77.5" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="453" y="93.8" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 5</text>

  <!-- Inner CV: spans folds 2-5 only (x=120 to x=498) -->
  <rect x="120" y="107.5" width="378" height="40" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3" stroke-dasharray="4,2"/>
  <text x="309" y="125" text-anchor="middle" font-size="11.2" fill="#B37700" font-weight="bold">Inner CV on folds 2, 3, 4, 5</text>
  <text x="309" y="140" text-anchor="middle" font-size="11.2" fill="#B37700">select ncomp = 4</text>

  <!-- Arrow + OOF -->
  <line x1="498" y1="127.5" x2="530" y2="127.5" stroke="#555" stroke-width="1.1" marker-end="u r l a r r o w R"/>
  <rect x="534" y="112.5" width="48" height="30" rx="3" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1.1"/>
  <text x="558" y="132.5" text-anchor="middle" font-size="10" fill="#2E8B57" font-weight="bold">OOF 1</text>

  <!-- ===== OUTER FOLD 2 ===== -->
  <!-- test = fold 2, train = folds 1, 3, 4, 5 -->
  <rect x="10" y="167.5" width="580" height="112.5" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.6"/>
  <text x="24" y="190" font-size="13.8" font-weight="bold" fill="#2C5F8A">Outer fold 2</text>

  <!-- Data blocks -->
  <rect x="24" y="200" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="69" y="216.2" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 1</text>
  <rect x="120" y="200" width="90" height="22.5" rx="3" fill="#D55E00" opacity="0.25" stroke="#D55E00" stroke-width="1.1"/>
  <text x="165" y="216.2" text-anchor="middle" font-size="11.2" fill="#D55E00" font-weight="bold">Fold 2 (test)</text>
  <rect x="216" y="200" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="261" y="216.2" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 3</text>
  <rect x="312" y="200" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="357" y="216.2" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 4</text>
  <rect x="408" y="200" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="453" y="216.2" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 5</text>

  <!-- Inner CV: two boxes — fold 1 (x=24..114) and folds 3-5 (x=216..498), skipping test fold 2 -->
  <rect x="24" y="232.5" width="90" height="37.5" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3" stroke-dasharray="4,2"/>
  <rect x="216" y="232.5" width="282" height="37.5" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3" stroke-dasharray="4,2"/>
  <!-- Dashed connector between the two yellow boxes -->
  <line x1="114" y1="251.2" x2="216" y2="251.2" stroke="#E6A020" stroke-width="1.1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="309" y="250" text-anchor="middle" font-size="11.2" fill="#B37700" font-weight="bold">Inner CV on folds 1, 3, 4, 5</text>
  <text x="309" y="262.5" text-anchor="middle" font-size="11.2" fill="#B37700">select ncomp = 3</text>

  <!-- Arrow + OOF -->
  <line x1="498" y1="251.2" x2="530" y2="251.2" stroke="#555" stroke-width="1.1" marker-end="u r l a r r o w R"/>
  <rect x="534" y="236.2" width="48" height="30" rx="3" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1.1"/>
  <text x="558" y="256.2" text-anchor="middle" font-size="10" fill="#2E8B57" font-weight="bold">OOF 2</text>

  <!-- ===== ELLIPSIS ===== -->
  <text x="300" y="305" text-anchor="middle" font-size="20" fill="#999" letter-spacing="6">. . .</text>

  <!-- ===== OUTER FOLD 5 ===== -->
  <!-- test = fold 5, train = folds 1-4 -->
  <rect x="10" y="322.5" width="580" height="112.5" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.6"/>
  <text x="24" y="345" font-size="13.8" font-weight="bold" fill="#2C5F8A">Outer fold 5</text>

  <!-- Data blocks -->
  <rect x="24" y="352.5" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="69" y="368.8" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 1</text>
  <rect x="120" y="352.5" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="165" y="368.8" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 2</text>
  <rect x="216" y="352.5" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="261" y="368.8" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 3</text>
  <rect x="312" y="352.5" width="90" height="22.5" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="357" y="368.8" text-anchor="middle" font-size="11.2" fill="#4A90D9">Fold 4</text>
  <rect x="408" y="352.5" width="90" height="22.5" rx="3" fill="#D55E00" opacity="0.25" stroke="#D55E00" stroke-width="1.1"/>
  <text x="453" y="368.8" text-anchor="middle" font-size="11.2" fill="#D55E00" font-weight="bold">Fold 5 (test)</text>

  <!-- Inner CV: spans folds 1-4 only (x=24 to x=402) -->
  <rect x="24" y="382.5" width="378" height="37.5" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3" stroke-dasharray="4,2"/>
  <text x="213" y="400" text-anchor="middle" font-size="11.2" fill="#B37700" font-weight="bold">Inner CV on folds 1, 2, 3, 4</text>
  <text x="213" y="412.5" text-anchor="middle" font-size="11.2" fill="#B37700">select ncomp = 5</text>

  <!-- Arrow + OOF -->
  <line x1="402" y1="401.2" x2="530" y2="401.2" stroke="#555" stroke-width="1.1" marker-end="u r l a r r o w R"/>
  <rect x="534" y="386.2" width="48" height="30" rx="3" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1.1"/>
  <text x="558" y="406.2" text-anchor="middle" font-size="10" fill="#2E8B57" font-weight="bold">OOF 5</text>

  <!-- ===== Vertical connector: OOF stack ===== -->
  <line x1="558" y1="142.5" x2="558" y2="167.5" stroke="#2E8B57" stroke-width="0.9" stroke-dasharray="2,2"/>
  <line x1="558" y1="266.2" x2="558" y2="290" stroke="#2E8B57" stroke-width="0.9" stroke-dasharray="2,2"/>
  <line x1="558" y1="310" x2="558" y2="322.5" stroke="#2E8B57" stroke-width="0.9" stroke-dasharray="2,2"/>
  <line x1="558" y1="416.2" x2="558" y2="435" stroke="#2E8B57" stroke-width="1.1" marker-end="u r l a r r o w D"/>

  <!-- Final result -->
  <rect x="480" y="437.5" width="116" height="25" rx="4" fill="#2E8B57" opacity="0.2" stroke="#2E8B57" stroke-width="1.3"/>
  <text x="538" y="455" text-anchor="middle" font-size="11.2" fill="#2E8B57" font-weight="bold">All OOF predictions</text>

  <!-- Legend -->
  <rect x="14" y="440" width="12" height="15" rx="2" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="30" y="452.5" font-size="11.2" fill="#555">Train</text>
  <rect x="70" y="440" width="12" height="15" rx="2" fill="#D55E00" opacity="0.25" stroke="#D55E00" stroke-width="1.1"/>
  <text x="86" y="452.5" font-size="11.2" fill="#555">Test</text>
  <rect x="120" y="440" width="12" height="15" rx="2" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3" stroke-dasharray="2,1"/>
  <text x="136" y="452.5" font-size="11.2" fill="#555">Inner CV (hyperparameter tuning)</text>
  <rect x="320" y="440" width="12" height="15" rx="2" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1.1"/>
  <text x="336" y="452.5" font-size="11.2" fill="#555">Out-of-fold prediction</text>
</svg>
