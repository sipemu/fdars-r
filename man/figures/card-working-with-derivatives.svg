<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Original curve -->
  <path d="M20 85 Q60 15, 100 55 Q140 95, 180 45" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tangent line at midpoint -->
  <line x1="70" y1="25" x2="130" y2="75" stroke="#0d6efd" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- Derivative curve below -->
  <path d="M20 95 Q50 75, 80 100 Q120 115, 150 90 Q170 80, 180 85" stroke="#0d6efd" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- f and f' labels -->
  <text x="182" y="42" font-family="serif" font-style="italic" font-size="11" fill="#0d6efd">f</text>
  <text x="182" y="88" font-family="serif" font-style="italic" font-size="11" fill="#0d6efd" opacity="0.5">f'</text>
</svg>
