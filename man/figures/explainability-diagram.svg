  <line x1="590" y1="305" x2="642" y2="272.5" stroke="#999" stroke-width="0.5" stroke-dasharray="2,1"/>
  <path d="M 590 302.5 Q 606 295.0 616 285.0 Q 626 277.5 642 275.0" stroke="#E6A020" stroke-width="1.3" fill="none"/>
  <text x="616" y="310" text-anchor="middle" font-size="7.5" fill="#888">ECE + Brier</text>

  <!-- ==================== BOTTOM: Cross-cutting ==================== -->
  <text x="350" y="410" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#C0392B">Cross-Cutting</text>

  <rect x="50" y="425" width="120" height="50" rx="5" fill="#FFE8E8" stroke="#C0392B" stroke-width="1.1"/>
  <text x="110" y="447.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">Stability</text>
  <text x="110" y="462.5" text-anchor="middle" font-size="8.8" fill="#666">bootstrap CV of &#946;(t)</text>

  <rect x="190" y="425" width="120" height="50" rx="5" fill="#FFE8E8" stroke="#C0392B" stroke-width="1.1"/>
  <text x="250" y="447.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">Bootstrap CI</text>
  <text x="250" y="462.5" text-anchor="middle" font-size="8.8" fill="#666">pointwise + simultaneous</text>

  <rect x="330" y="425" width="120" height="50" rx="5" fill="#FFE8E8" stroke="#C0392B" stroke-width="1.1"/>
  <text x="390" y="447.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">Regression Depth</text>
  <text x="390" y="462.5" text-anchor="middle" font-size="8.8" fill="#666">robustness of &#946;(t)</text>

  <rect x="470" y="425" width="120" height="50" rx="5" fill="#FFE8E8" stroke="#C0392B" stroke-width="1.1"/>
  <text x="530" y="447.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">Classification</text>
  <text x="530" y="462.5" text-anchor="middle" font-size="8.8" fill="#666">all methods dual-dispatch</text>

  <!-- Legend -->
  <rect x="10" y="485" width="8" height="10" rx="1" fill="#4A90D9" opacity="0.6"/>
  <text x="22" y="495" font-size="8.8" fill="#555">Score-level</text>
  <rect x="80" y="485" width="8" height="10" rx="1" fill="#7B2D8E" opacity="0.6"/>
  <text x="92" y="495" font-size="8.8" fill="#555">Domain-level</text>
  <rect x="160" y="485" width="8" height="10" rx="1" fill="#E6A020" opacity="0.6"/>
  <text x="172" y="495" font-size="8.8" fill="#555">Local</text>
  <rect x="210" y="485" width="8" height="10" rx="1" fill="#C0392B" opacity="0.6"/>
  <text x="222" y="495" font-size="8.8" fill="#555">Cross-cutting</text>
