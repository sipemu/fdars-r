  <path d="M 238 217.5 Q 260 215.0 280 197.5 Q 296 182.5 310 185.0 Q 324 187.5 340 205.0 Q 360 220.0 380 215.0" stroke="#7B2D8E" stroke-width="1.6" fill="none"/>
  <rect x="268" y="182.5" width="30" height="35" rx="2" fill="#7B2D8E" opacity="0.08"/>
  <text x="310" y="227.5" text-anchor="middle" font-size="7.5" fill="#888">fregre.pointwise</text>

  <!-- Saliency -->
  <rect x="228" y="245" width="78" height="70" rx="5" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.1"/>
  <text x="267" y="262.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B2D8E">Saliency</text>
  <!-- Mini heatmap -->
  <rect x="238" y="275" width="10" height="25" rx="1" fill="#7B2D8E" opacity="0.15"/>
  <rect x="250" y="275" width="10" height="25" rx="1" fill="#7B2D8E" opacity="0.35"/>
  <rect x="262" y="275" width="10" height="25" rx="1" fill="#7B2D8E" opacity="0.7"/>
  <rect x="274" y="275" width="10" height="25" rx="1" fill="#D55E00" opacity="0.6"/>
  <rect x="286" y="275" width="10" height="25" rx="1" fill="#7B2D8E" opacity="0.2"/>
  <text x="267" y="310" text-anchor="middle" font-size="7.5" fill="#888">fregre.saliency</text>

  <!-- Domain Importance -->
  <rect x="314" y="245" width="78" height="70" rx="5" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.1"/>
  <text x="353" y="262.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B2D8E">Domain</text>
  <!-- Mini sliding window -->
  <path d="M 324 297.5 Q 338 287.5 353 290.0 Q 368 292.5 382 285.0" stroke="#7B2D8E" stroke-width="1.6" fill="none"/>
  <rect x="338" y="280" width="20" height="22.5" rx="2" fill="#7B2D8E" opacity="0.1" stroke="#7B2D8E" stroke-width="0.5" stroke-dasharray="2,1"/>
  <text x="353" y="310" text-anchor="middle" font-size="7.5" fill="#888">fregre.domain</text>

  <!-- Significant Regions -->
  <rect x="228" y="325" width="164" height="62.5" rx="5" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.1"/>
  <text x="310" y="342.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B2D8E">Significant Regions</text>
  <!-- Mini beta with marked intervals -->
  <path d="M 240 370.0 Q 268 350.0 290 362.5 Q 310 372.5 340 352.5 Q 365 337.5 378 360.0" stroke="#7B2D8E" stroke-width="1.3" fill="none"/>
  <line x1="260" y1="347.5" x2="260" y2="372.5" stroke="#D55E00" stroke-width="1.1" opacity="0.5"/>
  <line x1="296" y1="347.5" x2="296" y2="372.5" stroke="#D55E00" stroke-width="1.1" opacity="0.5"/>
  <rect x="260" y="347.5" width="36" height="25" rx="1" fill="#D55E00" opacity="0.08"/>
  <text x="310" y="382.5" text-anchor="middle" font-size="7.5" fill="#888">fregre.significant.regions</text>

  <!-- ==================== COLUMN 3: Local Explanations ==================== -->
  <text x="500" y="132.5" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#B37700">Local Explanations</text>
  <text x="500" y="147.5" text-anchor="middle" font-size="8.8" fill="#888">Why this prediction?</text>

  <!-- SHAP -->
  <rect x="420" y="157.5" width="72" height="75" rx="5" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.1"/>
  <text x="456" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#B37700">SHAP</text>
  <rect x="432" y="187.5" width="36" height="8.8" rx="1" fill="#4A90D9" opacity="0.6"/>
  <rect x="432" y="200" width="24" height="8.8" rx="1" fill="#4A90D9" opacity="0.4"/>
  <rect x="432" y="212.5" width="12" height="8.8" rx="1" fill="#D55E00" opacity="0.5"/>
  <text x="456" y="227.5" text-anchor="middle" font-size="7.5" fill="#888">fregre.shap</text>

  <!-- LIME -->
  <rect x="500" y="157.5" width="72" height="75" rx="5" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.1"/>
  <text x="536" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#B37700">LIME</text>
  <circle cx="514" cy="212.5" r="1.5" fill="#E6A020" opacity="0.4"/>
  <circle cx="522" cy="205" r="1.5" fill="#E6A020" opacity="0.4"/>
  <circle cx="530" cy="202.5" r="2" fill="#D55E00" opacity="0.8"/>
  <circle cx="538" cy="197.5" r="1.5" fill="#E6A020" opacity="0.4"/>
  <circle cx="546" cy="190" r="1.5" fill="#E6A020" opacity="0.4"/>
  <line x1="510" y1="217.5" x2="550" y2="187.5" stroke="#B37700" stroke-width="1.1" opacity="0.6"/>
  <text x="536" y="227.5" text-anchor="middle" font-size="7.5" fill="#888">fregre.lime</text>

  <!-- Counterfactual -->
  <rect x="580" y="157.5" width="72" height="75" rx="5" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.1"/>
  <text x="616" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#B37700">Counter-</text>
  <text x="616" y="187.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#B37700">factual</text>
  <circle cx="596" cy="212.5" r="3" fill="#D55E00" opacity="0.6"/>
  <line x1="602" y1="212.5" x2="628" y2="212.5" stroke="#555" stroke-width="0.9" marker-end="u r l a r r E X" opacity="0.5"/>
  <circle cx="636" cy="212.5" r="3" fill="#2E8B57" opacity="0.6"/>
  <text x="616" y="227.5" text-anchor="middle" font-size="7.5" fill="#888">fregre.counterfactual</text>

  <!-- Anchor -->
  <rect x="420" y="245" width="72" height="70" rx="5" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.1"/>
  <text x="456" y="262.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#B37700">Anchor</text>
  <rect x="430" y="275" width="52" height="22.5" rx="3" fill="#E6A020" opacity="0.1" stroke="#E6A020" stroke-width="0.5"/>
  <text x="456" y="290" text-anchor="middle" font-size="7.5" fill="#B37700">IF PC1 &#8712; [a,b]</text>
  <text x="456" y="310" text-anchor="middle" font-size="7.5" fill="#888">fregre.anchor</text>

  <!-- Prototype -->
  <rect x="500" y="245" width="72" height="70" rx="5" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.1"/>
  <text x="536" y="262.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#B37700">Prototype</text>
  <circle cx="516" cy="292.5" r="4" fill="#4A90D9" opacity="0.5"/>
  <circle cx="530" cy="287.5" r="4" fill="#4A90D9" opacity="0.5"/>
  <circle cx="546" cy="295" r="4" fill="#D55E00" opacity="0.5"/>
  <circle cx="556" cy="285" r="4" fill="#D55E00" opacity="0.5"/>
  <text x="536" y="310" text-anchor="middle" font-size="7.5" fill="#888">fregre.prototype</text>

  <!-- Calibration -->
  <rect x="580" y="245" width="72" height="70" rx="5" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.1"/>
  <text x="616" y="262.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#B37700">Calibration</text>
