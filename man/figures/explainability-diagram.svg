<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrEX" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Model Explainability for Functional Regression</text>
  <text x="350" y="45" text-anchor="middle" font-size="11.2" fill="#888">22 methods across 4 categories --- all work with fregre.lm and functional.logistic</text>

  <!-- ===== Model box (center top) ===== -->
  <rect x="255" y="60" width="190" height="47.5" rx="8" fill="#2E8B57" opacity="0.12" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="350" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E8B57">Fitted Model</text>
  <text x="350" y="97.5" text-anchor="middle" font-size="10" fill="#888">y&#7522; = &#945; + &#8747; X&#7522;(t) &#946;(t) dt + &#949;&#7522;</text>

  <!-- Connecting lines from model to four groups -->
  <line x1="300" y1="107.5" x2="115" y2="135" stroke="#4A90D9" stroke-width="0.9" opacity="0.3"/>
  <line x1="330" y1="107.5" x2="310" y2="135" stroke="#7B2D8E" opacity="0.3" stroke-width="0.9"/>
  <line x1="370" y1="107.5" x2="500" y2="135" stroke="#E6A020" stroke-width="0.9" opacity="0.3"/>
  <line x1="350" y1="107.5" x2="350" y2="385" stroke="#C0392B" stroke-width="0.6" opacity="0.2"/>

  <!-- ==================== COLUMN 1: Global (Score-Level) ==================== -->
  <text x="115" y="132.5" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#2C5F8A">Global (Score)</text>
  <text x="115" y="147.5" text-anchor="middle" font-size="8.8" fill="#888">Which FPC scores matter?</text>

  <!-- PDP -->
  <rect x="12" y="157.5" width="96" height="75" rx="5" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="60" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C5F8A">PDP</text>
  <path d="M 22 215.0 Q 40 202.5 58 207.5 Q 76 212.5 96 195.0" stroke="#4A90D9" stroke-width="1.6" fill="none"/>
  <text x="60" y="227.5" text-anchor="middle" font-size="7.5" fill="#888">fregre.pdp</text>

  <!-- ALE -->
  <rect x="118" y="157.5" width="96" height="75" rx="5" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="166" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C5F8A">ALE</text>
  <path d="M 128 215.0 L 142 215.0 L 142 205.0 L 156 205.0 L 156 197.5 L 170 197.5 L 170 192.5 L 184 192.5 L 184 202.5 L 196 202.5" stroke="#4A90D9" stroke-width="1.6" fill="none"/>
  <text x="166" y="227.5" text-anchor="middle" font-size="7.5" fill="#888">fregre.ale</text>

  <!-- Sobol -->
  <rect x="12" y="245" width="96" height="70" rx="5" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="60" y="262.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C5F8A">Sobol</text>
  <rect x="24" y="272.5" width="12" height="30" rx="1" fill="#4A90D9" opacity="0.6"/>
  <rect x="40" y="280" width="12" height="22.5" rx="1" fill="#D55E00" opacity="0.5"/>
  <rect x="56" y="287.5" width="12" height="15" rx="1" fill="#4A90D9" opacity="0.4"/>
  <rect x="72" y="295" width="12" height="7.5" rx="1" fill="#D55E00" opacity="0.3"/>
  <text x="60" y="310" text-anchor="middle" font-size="7.5" fill="#888">fregre.sobol</text>

  <!-- Friedman -->
  <rect x="118" y="245" width="96" height="70" rx="5" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="166" y="262.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C5F8A">Friedman H</text>
  <text x="166" y="287.5" text-anchor="middle" font-size="8.8" fill="#666">FPC interactions</text>
  <text x="166" y="302.5" text-anchor="middle" font-size="8.8" fill="#666">H(PC1, PC2)</text>
  <text x="166" y="310" text-anchor="middle" font-size="7.5" fill="#888">fregre.friedman</text>

  <!-- Beta Decomposition -->
  <rect x="12" y="325" width="96" height="62.5" rx="5" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="60" y="342.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C5F8A">Beta Decomp</text>
  <text x="60" y="360" text-anchor="middle" font-size="8.8" fill="#666">VP&#8342; per component</text>
  <text x="60" y="382.5" text-anchor="middle" font-size="7.5" fill="#888">fregre.beta.decomp</text>

  <!-- Permutation Importance -->
  <rect x="118" y="325" width="96" height="62.5" rx="5" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="166" y="342.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C5F8A">Importance</text>
  <text x="166" y="360" text-anchor="middle" font-size="8.8" fill="#666">permutation &amp;</text>
  <text x="166" y="372.5" text-anchor="middle" font-size="8.8" fill="#666">conditional</text>
  <text x="166" y="382.5" text-anchor="middle" font-size="7.5" fill="#888">fregre.importance</text>

  <!-- ==================== COLUMN 2: Global (Domain-Level) ==================== -->
  <text x="310" y="132.5" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#7B2D8E">Global (Domain)</text>
  <text x="310" y="147.5" text-anchor="middle" font-size="8.8" fill="#888">Where on t does it matter?</text>

  <!-- Pointwise Importance -->
  <rect x="228" y="157.5" width="164" height="75" rx="5" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.1"/>
  <text x="310" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B2D8E">Pointwise Importance</text>
