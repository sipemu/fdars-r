<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250">
  <defs>
    <marker id="sa" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Step 1: Raw Curves -->
  <rect x="10" y="85" width="100" height="50" rx="8" fill="#e7f0fd" stroke="#4169E1" stroke-width="1.5"/>
  <text x="60" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">Raw Curves</text>
  <line x1="110" y1="110" x2="135" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#sa)"/>

  <!-- Step 2: Remove Reparameterization (purple) -->
  <rect x="135" y="80" width="120" height="60" rx="8" fill="#f3e8f8" stroke="#7B2D8E" stroke-width="1.5"/>
  <text x="195" y="103" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">Remove</text>
  <text x="195" y="117" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">Reparam.</text>
  <text x="195" y="131" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888">(Elastic)</text>
  <line x1="255" y1="110" x2="280" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#sa)"/>

  <!-- Step 3: Remove Rotation/Scale (purple) -->
  <rect x="280" y="80" width="120" height="60" rx="8" fill="#f3e8f8" stroke="#7B2D8E" stroke-width="1.5"/>
  <text x="340" y="103" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">Remove</text>
  <text x="340" y="117" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">Rotation/Scale</text>
  <text x="340" y="131" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888">(Orbit)</text>
  <line x1="400" y1="110" x2="425" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#sa)"/>

  <!-- Step 4: Shape Space (purple) -->
  <rect x="425" y="85" width="110" height="50" rx="8" fill="#f3e8f8" stroke="#7B2D8E" stroke-width="1.5"/>
  <text x="480" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">Shape</text>
  <text x="480" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">Space</text>
  <line x1="535" y1="110" x2="560" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#sa)"/>

  <!-- Step 5: Distance / Mean (green) -->
  <rect x="560" y="75" width="120" height="70" rx="8" fill="#f0faf0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="620" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">Distance</text>
  <line x1="585" y1="115" x2="655" y2="115" stroke="#2E8B57" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="620" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">Mean</text>

  <!-- Labels -->
  <text x="267" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7B2D8E" font-weight="bold">SHAPE-SPECIFIC TRANSFORMATIONS</text>
  <text x="620" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2E8B57" font-weight="bold">OUTPUT</text>
</svg>