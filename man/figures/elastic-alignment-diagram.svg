<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 425" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrEA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="27.5" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Elastic Alignment: Separating Phase and Amplitude</text>

  <!-- ===== STEP 1: Original curves ===== -->
  <rect x="14" y="52.5" width="130" height="137.5" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.3"/>
  <text x="79" y="72.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C5F8A">Original Curves</text>
  <text x="79" y="87.5" text-anchor="middle" font-size="10" fill="#888">phase + amplitude mixed</text>

  <!-- Three shifted/scaled sine curves -->
  <path d="M 24 150.0 Q 40 107.5 56 125.0 Q 72 142.5 88 117.5 Q 104 92.5 120 125.0 Q 130 142.5 134 135.0" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.8"/>
  <path d="M 24 147.5 Q 36 110.0 48 120.0 Q 60 130.0 76 110.0 Q 92 90.0 108 120.0 Q 120 140.0 134 132.5" stroke="#D55E00" stroke-width="1.6" fill="none" opacity="0.7"/>
  <path d="M 24 152.5 Q 44 112.5 60 130.0 Q 76 147.5 92 120.0 Q 108 92.5 124 130.0 Q 134 147.5 134 140.0" stroke="#7B2D8E" stroke-width="1.6" fill="none" opacity="0.6"/>

  <!-- Arrow -->
  <line x1="148" y1="121.2" x2="172" y2="121.2" stroke="#555" stroke-width="1.3" marker-end="u r l a r r E A"/>
  <text x="160" y="110" text-anchor="middle" font-size="8.8" fill="#888">SRSF</text>
  <text x="160" y="140" text-anchor="middle" font-size="8.8" fill="#888">align</text>

  <!-- ===== STEP 2: Warping functions ===== -->
  <rect x="178" y="52.5" width="115" height="137.5" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3"/>
  <text x="235" y="72.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B37700">Warping &#947;(t)</text>
  <text x="235" y="87.5" text-anchor="middle" font-size="10" fill="#888">timing adjustment</text>

  <!-- Warping functions: near-identity with slight bends -->
  <!-- Diagonal reference -->
  <line x1="192" y1="175" x2="280" y2="102.5" stroke="#ccc" stroke-width="0.9" stroke-dasharray="3,2"/>
  <!-- Warp 1 -->
  <path d="M 192 175.0 Q 210 157.5 230 135.0 Q 250 112.5 280 105.0" stroke="#4A90D9" stroke-width="1.4" fill="none" opacity="0.8"/>
  <!-- Warp 2 -->
  <path d="M 192 175.0 Q 220 150.0 240 132.5 Q 260 115.0 280 102.5" stroke="#D55E00" stroke-width="1.4" fill="none" opacity="0.7"/>
  <!-- Warp 3 -->
  <path d="M 192 175.0 Q 208 165.0 224 145.0 Q 248 117.5 280 107.5" stroke="#7B2D8E" stroke-width="1.4" fill="none" opacity="0.6"/>

  <text x="196" y="185" font-size="8.8" fill="#888">0</text>
  <text x="278" y="100" text-anchor="end" font-size="8.8" fill="#888">1</text>

  <!-- Arrow -->
  <line x1="297" y1="121.2" x2="321" y2="121.2" stroke="#555" stroke-width="1.3" marker-end="u r l a r r E A"/>

  <!-- ===== STEP 3: Aligned curves ===== -->
  <rect x="327" y="52.5" width="130" height="137.5" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.3"/>
  <text x="392" y="72.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E8B57">Aligned Curves</text>
  <text x="392" y="87.5" text-anchor="middle" font-size="10" fill="#888">amplitude only</text>

  <!-- Three curves now in sync but different heights -->
  <path d="M 337 150.0 Q 355 110.0 373 125.0 Q 391 140.0 409 115.0 Q 427 90.0 445 127.5" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.8"/>
  <path d="M 337 155.0 Q 355 120.0 373 132.5 Q 391 145.0 409 122.5 Q 427 100.0 445 135.0" stroke="#D55E00" stroke-width="1.6" fill="none" opacity="0.7"/>
  <path d="M 337 147.5 Q 355 105.0 373 120.0 Q 391 135.0 409 110.0 Q 427 85.0 445 122.5" stroke="#7B2D8E" stroke-width="1.6" fill="none" opacity="0.6"/>

  <!-- ===== RIGHT: Karcher mean ===== -->
  <line x1="461" y1="100" x2="478" y2="100" stroke="#555" stroke-width="1.1" marker-end="u r l a r r E A"/>
  <rect x="484" y="70" width="106" height="65" rx="6" fill="#2E8B57" opacity="0.12" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="537" y="92.5" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#2E8B57">Karcher Mean</text>
  <!-- Clean mean curve -->
  <path d="M 494 120.0 Q 510 100.0 526 110.0 Q 537 117.5 537 107.5" stroke="#2E8B57" stroke-width="2.1" fill="none"/>
  <text x="537" y="105" text-anchor="middle" font-size="10" fill="#888">sharp, not blurred</text>

  <!-- ===== BOTTOM: Decomposition ===== -->
  <line x1="10" y1="210" x2="590" y2="210" stroke="#eee" stroke-width="1.1"/>

  <text x="300" y="235" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#555">Variability Decomposition</text>

  <!-- Phase variability box -->
  <rect x="30" y="250" width="250" height="87.5" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3"/>
  <text x="155" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B37700">Phase Variability</text>
  <text x="155" y="295" text-anchor="middle" font-size="11.2" fill="#555">When do features occur?</text>
  <text x="155" y="315" text-anchor="middle" font-size="10" fill="#888">Captured by warping functions &#947;&#7522;(t)</text>
  <text x="155" y="330" text-anchor="middle" font-size="10" fill="#888">Horizontal shifts, rate differences</text>

  <!-- Amplitude variability box -->
  <rect x="320" y="250" width="250" height="87.5" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.3"/>
  <text x="445" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E8B57">Amplitude Variability</text>
  <text x="445" y="295" text-anchor="middle" font-size="11.2" fill="#555">How large are features?</text>
  <text x="445" y="315" text-anchor="middle" font-size="10" fill="#888">Captured by aligned curves f&#7522;(&#947;&#7522;(t))</text>
  <text x="445" y="330" text-anchor="middle" font-size="10" fill="#888">Height, shape differences</text>

  <!-- Bottom note -->
  <text x="300" y="365" text-anchor="middle" font-size="11.2" fill="#888">Standard mean blurs peaks &#8594; elastic mean preserves shape by aligning first</text>

  <!-- Legend -->
  <line x1="10" y1="380" x2="590" y2="380" stroke="#eee" stroke-width="1.1"/>
  <line x1="20" y1="400" x2="40" y2="400" stroke="#4A90D9" stroke-width="2.1" opacity="0.8"/>
  <text x="46" y="405" font-size="11.2" fill="#555">Curve 1</text>
  <line x1="90" y1="400" x2="110" y2="400" stroke="#D55E00" stroke-width="2.1" opacity="0.7"/>
  <text x="116" y="405" font-size="11.2" fill="#555">Curve 2</text>
  <line x1="160" y1="400" x2="180" y2="400" stroke="#7B2D8E" stroke-width="2.1" opacity="0.6"/>
  <text x="186" y="405" font-size="11.2" fill="#555">Curve 3</text>
  <line x1="240" y1="400" x2="260" y2="400" stroke="#ccc" stroke-width="1.1" stroke-dasharray="3,2"/>
  <text x="266" y="405" font-size="11.2" fill="#555">Identity warp (no change)</text>
</svg>
