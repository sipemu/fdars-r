<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Data table (left side) -->
  <!-- Header row -->
  <rect x="10" y="28" width="22" height="14" rx="2" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
  <rect x="32" y="28" width="22" height="14" rx="2" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
  <rect x="54" y="28" width="22" height="14" rx="2" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
  <rect x="76" y="28" width="22" height="14" rx="2" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
  <text x="21" y="38" text-anchor="middle" font-size="6" fill="#555" font-family="sans-serif">x1</text>
  <text x="43" y="38" text-anchor="middle" font-size="6" fill="#555" font-family="sans-serif">x2</text>
  <text x="65" y="38" text-anchor="middle" font-size="6" fill="#555" font-family="sans-serif">x3</text>
  <text x="87" y="38" text-anchor="middle" font-size="6" fill="#555" font-family="sans-serif">x4</text>
  <!-- Data row 1 (Barolo) -->
  <rect x="10" y="42" width="22" height="14" rx="2" fill="#8B0000" opacity="0.15" stroke="#8B0000" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="32" y="42" width="22" height="14" rx="2" fill="#8B0000" opacity="0.25" stroke="#8B0000" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="54" y="42" width="22" height="14" rx="2" fill="#8B0000" opacity="0.35" stroke="#8B0000" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="76" y="42" width="22" height="14" rx="2" fill="#8B0000" opacity="0.2" stroke="#8B0000" stroke-width="0.5" stroke-opacity="0.3"/>
  <!-- Data row 2 (Gold) -->
  <rect x="10" y="56" width="22" height="14" rx="2" fill="#DAA520" opacity="0.3" stroke="#DAA520" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="32" y="56" width="22" height="14" rx="2" fill="#DAA520" opacity="0.15" stroke="#DAA520" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="54" y="56" width="22" height="14" rx="2" fill="#DAA520" opacity="0.2" stroke="#DAA520" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="76" y="56" width="22" height="14" rx="2" fill="#DAA520" opacity="0.35" stroke="#DAA520" stroke-width="0.5" stroke-opacity="0.3"/>
  <!-- Data row 3 (Green) -->
  <rect x="10" y="70" width="22" height="14" rx="2" fill="#2E8B57" opacity="0.2" stroke="#2E8B57" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="32" y="70" width="22" height="14" rx="2" fill="#2E8B57" opacity="0.35" stroke="#2E8B57" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="54" y="70" width="22" height="14" rx="2" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="76" y="70" width="22" height="14" rx="2" fill="#2E8B57" opacity="0.25" stroke="#2E8B57" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Arrow -->
  <line x1="104" y1="56" x2="118" y2="56" stroke="#555" stroke-width="1.5" opacity="0.5"/>
  <polygon points="116,52 123,56 116,60" fill="#555" opacity="0.5"/>

  <!-- Andrews curves (right side) -->
  <!-- Barolo curve -->
  <path d="M128 55 Q138 30, 148 28 Q158 30, 165 50 Q172 70, 178 72 Q184 68, 192 55" stroke="#8B0000" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Gold curve -->
  <path d="M128 62 Q138 72, 148 75 Q158 70, 165 52 Q172 38, 178 35 Q184 40, 192 50" stroke="#DAA520" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Green curve -->
  <path d="M128 48 Q138 55, 148 60 Q158 58, 165 42 Q172 30, 178 32 Q184 42, 192 52" stroke="#2E8B57" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Subtle axis -->
  <line x1="128" y1="90" x2="192" y2="90" stroke="#ccc" stroke-width="0.5"/>
  <text x="160" y="98" text-anchor="middle" font-size="6" fill="#999" font-family="sans-serif">t</text>
