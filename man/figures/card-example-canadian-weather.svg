<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Seasonal temperature curves by region -->
  <!-- Arctic (blue, coldest) -->
  <path d="M15 35 Q40 38, 60 55 Q80 75, 100 80 Q120 75, 140 55 Q160 38, 185 35" stroke="#56B4E9" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Continental (green, wide swing) -->
  <path d="M15 40 Q40 50, 60 65 Q80 88, 100 92 Q120 88, 140 65 Q160 50, 185 40" stroke="#009E73" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Atlantic (orange, moderate) -->
  <path d="M15 50 Q40 55, 60 65 Q80 82, 100 85 Q120 82, 140 65 Q160 55, 185 50" stroke="#E69F00" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Pacific (pink, mildest) -->
  <path d="M15 58 Q40 60, 60 67 Q80 78, 100 80 Q120 78, 140 67 Q160 60, 185 58" stroke="#CC79A7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Legend dots -->
  <circle cx="30" cy="105" r="3" fill="#56B4E9"/>
  <circle cx="70" cy="105" r="3" fill="#009E73"/>
  <circle cx="115" cy="105" r="3" fill="#E69F00"/>
  <circle cx="160" cy="105" r="3" fill="#CC79A7"/>
  <!-- Season markers -->
  <line x1="15" y1="95" x2="185" y2="95" stroke="#ccc" stroke-width="0.5"/>
  <text x="15" y="15" font-size="5" fill="#666" font-family="sans-serif">Jan</text>
  <text x="95" y="15" font-size="5" fill="#666" font-family="sans-serif">Jul</text>
  <text x="178" y="15" font-size="5" fill="#666" font-family="sans-serif">Dec</text>
</svg>
