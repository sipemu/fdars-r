<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 225" fill="none">
  <defs>
    <style>text { font-family: 'Segoe UI', system-ui, sans-serif; }</style>
  </defs>

  <!-- Title -->
  <text x="350" y="25" font-size="17.5" fill="#333" text-anchor="middle" font-weight="600">Pure Amplitude Changepoint: Shape Changes, Timing Stays the Same</text>

  <!-- Before panel -->
  <rect x="20" y="40" width="280" height="162.5" rx="8" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="160" y="62.5" font-size="13.8" fill="#4A90D9" text-anchor="middle" font-weight="600">Before (i = 1 … 30)</text>
  <!-- Sine waves (small amplitude) -->
  <path d="M 40 125.0 Q 80 87.5 120 125.0 Q 160 162.5 200 125.0 Q 240 87.5 280 125.0" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.6"/>
  <path d="M 40 127.5 Q 80 92.5 120 127.5 Q 160 160.0 200 127.5 Q 240 92.5 280 127.5" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.4"/>
  <path d="M 40 122.5 Q 80 90.0 120 122.5 Q 160 157.5 200 122.5 Q 240 90.0 280 122.5" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.3"/>
  <text x="160" y="187.5" font-size="11.2" fill="#666" text-anchor="middle">sin(2πt)</text>

  <!-- Arrow -->
  <line x1="320" y1="121.2" x2="370" y2="121.2" stroke="#D55E00" stroke-width="2.1" marker-end="u r l a r r o w"/>
  <text x="345" y="110" font-size="12.5" fill="#D55E00" text-anchor="middle" font-weight="600">τ = 30</text>
  <defs><marker id="a r r o w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto"><path d="M 0 0.0 L 10 6.2 L 0 12.5 z" fill="#D55E00"/></marker></defs>

  <!-- After panel -->
  <rect x="400" y="40" width="280" height="162.5" rx="8" fill="#FFE8E8" stroke="#D55E00" stroke-width="1.1"/>
  <text x="540" y="62.5" font-size="13.8" fill="#D55E00" text-anchor="middle" font-weight="600">After (i = 31 … 60)</text>
  <!-- Sine waves (large amplitude + harmonic) -->
  <path d="M 420 125.0 Q 445 68.8 470 106.2 Q 495 143.8 520 100.0 Q 545 62.5 570 118.8 Q 595 168.8 620 106.2 Q 645 62.5 660 125.0" stroke="#D55E00" stroke-width="1.9" fill="none" opacity="0.6"/>
  <path d="M 420 127.5 Q 445 72.5 470 110.0 Q 495 140.0 520 102.5 Q 545 66.2 570 121.2 Q 595 165.0 620 108.8 Q 645 66.2 660 127.5" stroke="#D55E00" stroke-width="1.9" fill="none" opacity="0.4"/>
  <path d="M 420 122.5 Q 445 65.0 470 102.5 Q 495 147.5 520 97.5 Q 545 60.0 570 116.2 Q 595 172.5 620 103.8 Q 645 60.0 660 122.5" stroke="#D55E00" stroke-width="1.9" fill="none" opacity="0.3"/>
  <text x="540" y="187.5" font-size="11.2" fill="#666" text-anchor="middle">2·sin(2πt) + 0.8·sin(4πt)</text>
</svg>
