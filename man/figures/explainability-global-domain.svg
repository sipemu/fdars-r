<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Title -->
  <text x="350" y="16" text-anchor="middle" font-size="15" font-weight="bold" fill="#7B2D8E">Global Explanations: Domain-Level</text>
  <text x="350" y="30" text-anchor="middle" font-size="10" fill="#888">Where on the functional domain t does the model focus?</text>

  <!-- Pointwise Importance -->
  <rect x="10" y="42" width="165" height="108" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.2"/>
  <text x="92" y="58" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#7B2D8E">Pointwise Importance</text>
  <line x1="24" y1="134" x2="162" y2="134" stroke="#ccc" stroke-width="0.6"/>
  <line x1="24" y1="66" x2="24" y2="134" stroke="#ccc" stroke-width="0.6"/>
  <!-- Importance curve with two peaks matching beta -->
  <path d="M28 128 Q46 126 64 104 Q78 82 92 86 Q106 90 120 108 Q138 128 162 126" stroke="#7B2D8E" stroke-width="1.8" fill="none"/>
  <path d="M28 128 Q46 126 64 104 Q78 82 92 86 Q106 90 120 108 Q138 128 162 126 L162 134 L28 134 Z" fill="#7B2D8E" opacity="0.1"/>
  <text x="70" y="78" text-anchor="middle" font-size="7.5" fill="#D55E00">peak</text>
  <text x="92" y="148" text-anchor="middle" font-size="8.8" fill="#888">fregre.pointwise</text>

  <!-- Saliency Map -->
  <rect x="185" y="42" width="165" height="108" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.2"/>
  <text x="267" y="58" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#7B2D8E">Saliency Map</text>
  <line x1="199" y1="134" x2="337" y2="134" stroke="#ccc" stroke-width="0.6"/>
  <line x1="199" y1="66" x2="199" y2="134" stroke="#ccc" stroke-width="0.6"/>
  <!-- Gradient heatmap bars -->
  <rect x="203" y="74" width="12" height="56" rx="1" fill="#7B2D8E" opacity="0.1"/>
  <rect x="217" y="74" width="12" height="56" rx="1" fill="#7B2D8E" opacity="0.2"/>
  <rect x="231" y="74" width="12" height="56" rx="1" fill="#7B2D8E" opacity="0.4"/>
  <rect x="245" y="74" width="12" height="56" rx="1" fill="#C0392B" opacity="0.7"/>
  <rect x="259" y="74" width="12" height="56" rx="1" fill="#7B2D8E" opacity="0.3"/>
  <rect x="273" y="74" width="12" height="56" rx="1" fill="#7B2D8E" opacity="0.15"/>
  <rect x="287" y="74" width="12" height="56" rx="1" fill="#7B2D8E" opacity="0.25"/>
  <rect x="301" y="74" width="12" height="56" rx="1" fill="#C0392B" opacity="0.5"/>
  <rect x="315" y="74" width="12" height="56" rx="1" fill="#7B2D8E" opacity="0.15"/>
  <text x="205" y="140" font-size="7.5" fill="#888">0</text>
  <text x="325" y="140" font-size="7.5" fill="#888">1</text>
  <text x="267" y="148" text-anchor="middle" font-size="8.8" fill="#888">fregre.saliency</text>

  <!-- Domain Importance -->
  <rect x="360" y="42" width="165" height="108" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.2"/>
  <text x="442" y="58" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#7B2D8E">Domain Importance</text>
  <line x1="374" y1="134" x2="512" y2="134" stroke="#ccc" stroke-width="0.6"/>
  <line x1="374" y1="66" x2="374" y2="134" stroke="#ccc" stroke-width="0.6"/>
  <!-- Sliding window concept -->
  <path d="M378 120 Q400 118 420 100 Q440 84 460 90 Q480 96 500 116" stroke="#7B2D8E" stroke-width="1.5" fill="none"/>
  <!-- Window highlight -->
  <rect x="408" y="82" width="36" height="52" rx="2" fill="#7B2D8E" opacity="0.08" stroke="#7B2D8E" stroke-width="0.6" stroke-dasharray="3,2"/>
  <path d="M414 86 L438 86" stroke="#D55E00" stroke-width="1.5"/>
  <text x="426" y="80" text-anchor="middle" font-size="7.5" fill="#D55E00">window</text>
  <text x="442" y="148" text-anchor="middle" font-size="8.8" fill="#888">fregre.domain</text>

  <!-- Significant Regions -->
  <rect x="535" y="42" width="155" height="108" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.2"/>
  <text x="612" y="58" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#7B2D8E">Significant Regions</text>
  <line x1="549" y1="134" x2="677" y2="134" stroke="#ccc" stroke-width="0.6"/>
  <line x1="549" y1="66" x2="549" y2="134" stroke="#ccc" stroke-width="0.6"/>
  <!-- Beta curve -->
  <path d="M553 106 Q575 86 598 80 Q612 78 626 96 Q640 114 668 120" stroke="#7B2D8E" stroke-width="1.5" fill="none"/>
  <!-- Zero line -->
  <line x1="549" y1="106" x2="677" y2="106" stroke="#999" stroke-width="0.4" stroke-dasharray="3,2"/>
  <!-- Significant interval shading -->
  <rect x="568" y="68" width="48" height="66" rx="1" fill="#D55E00" opacity="0.1"/>
  <line x1="568" y1="68" x2="568" y2="134" stroke="#D55E00" stroke-width="0.8" stroke-dasharray="2,1"/>
  <line x1="616" y1="68" x2="616" y2="134" stroke="#D55E00" stroke-width="0.8" stroke-dasharray="2,1"/>
  <text x="592" y="142" text-anchor="middle" font-size="7.5" fill="#D55E00">&#946;(t) &#8800; 0</text>
  <text x="612" y="148" text-anchor="middle" font-size="8.8" fill="#888">fregre.significant.regions</text>
</svg>
