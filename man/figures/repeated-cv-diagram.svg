<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrowD" markerWidth="6" markerHeight="8" refX="3" refY="7" orient="auto">
      <path d="M0,0 L3,8 L6,0" fill="#555"/>
    </marker>
    <marker id="arrowDG" markerWidth="6" markerHeight="8" refX="3" refY="7" orient="auto">
      <path d="M0,0 L3,8 L6,0" fill="#2E8B57"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Repeated K-Fold Cross-Validation</text>
  <text x="300" y="40" text-anchor="middle" font-size="10" fill="#888">Same data, different random fold partitions each repetition</text>

  <!-- ===== REP 1 ===== -->
  <rect x="14" y="54" width="180" height="168" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="104" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C5F8A">Rep 1</text>

  <!-- 8 observations in 2x4 grid, colored by fold -->
  <!-- Row 1: obs 1-4 -->
  <rect x="30" y="80" width="32" height="20" rx="3" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="46" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <rect x="66" y="80" width="32" height="20" rx="3" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="82" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <rect x="102" y="80" width="32" height="20" rx="3" fill="#D55E00" opacity="0.6" stroke="#D55E00" stroke-width="0.8"/>
  <text x="118" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">2</text>
  <rect x="138" y="80" width="32" height="20" rx="3" fill="#D55E00" opacity="0.6" stroke="#D55E00" stroke-width="0.8"/>
  <text x="154" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">2</text>
  <!-- Row 2: obs 5-8 -->
  <rect x="30" y="104" width="32" height="20" rx="3" fill="#7B2D8E" opacity="0.6" stroke="#7B2D8E" stroke-width="0.8"/>
  <text x="46" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">3</text>
  <rect x="66" y="104" width="32" height="20" rx="3" fill="#7B2D8E" opacity="0.6" stroke="#7B2D8E" stroke-width="0.8"/>
  <text x="82" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">3</text>
  <rect x="102" y="104" width="32" height="20" rx="3" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="118" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <rect x="138" y="104" width="32" height="20" rx="3" fill="#7B2D8E" opacity="0.6" stroke="#7B2D8E" stroke-width="0.8"/>
  <text x="154" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">3</text>

  <!-- k-fold CV label -->
  <line x1="104" y1="130" x2="104" y2="148" stroke="#555" stroke-width="1" marker-end="url(#arrowD)"/>
  <text x="104" y="162" text-anchor="middle" font-size="9" fill="#555">3-fold CV</text>

  <!-- OOF output -->
  <line x1="104" y1="168" x2="104" y2="184" stroke="#2E8B57" stroke-width="1" marker-end="url(#arrowDG)"/>
  <rect x="62" y="188" width="84" height="24" rx="4" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1.2"/>
  <text x="104" y="204" text-anchor="middle" font-size="9" fill="#2E8B57" font-weight="bold">OOF&#x2081; (n preds)</text>

  <!-- ===== REP 2 ===== -->
  <rect x="210" y="54" width="180" height="168" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="300" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C5F8A">Rep 2</text>

  <!-- 8 observations, different fold assignment -->
  <rect x="226" y="80" width="32" height="20" rx="3" fill="#D55E00" opacity="0.6" stroke="#D55E00" stroke-width="0.8"/>
  <text x="242" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">2</text>
  <rect x="262" y="80" width="32" height="20" rx="3" fill="#7B2D8E" opacity="0.6" stroke="#7B2D8E" stroke-width="0.8"/>
  <text x="278" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">3</text>
  <rect x="298" y="80" width="32" height="20" rx="3" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="314" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <rect x="334" y="80" width="32" height="20" rx="3" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="350" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <!-- Row 2 -->
  <rect x="226" y="104" width="32" height="20" rx="3" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="242" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <rect x="262" y="104" width="32" height="20" rx="3" fill="#D55E00" opacity="0.6" stroke="#D55E00" stroke-width="0.8"/>
  <text x="278" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">2</text>
  <rect x="298" y="104" width="32" height="20" rx="3" fill="#7B2D8E" opacity="0.6" stroke="#7B2D8E" stroke-width="0.8"/>
  <text x="314" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">3</text>
  <rect x="334" y="104" width="32" height="20" rx="3" fill="#D55E00" opacity="0.6" stroke="#D55E00" stroke-width="0.8"/>
  <text x="350" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">2</text>

  <line x1="300" y1="130" x2="300" y2="148" stroke="#555" stroke-width="1" marker-end="url(#arrowD)"/>
  <text x="300" y="162" text-anchor="middle" font-size="9" fill="#555">3-fold CV</text>
  <line x1="300" y1="168" x2="300" y2="184" stroke="#2E8B57" stroke-width="1" marker-end="url(#arrowDG)"/>
  <rect x="258" y="188" width="84" height="24" rx="4" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1.2"/>
  <text x="300" y="204" text-anchor="middle" font-size="9" fill="#2E8B57" font-weight="bold">OOF&#x2082; (n preds)</text>

  <!-- ===== REP 3 ===== -->
  <rect x="406" y="54" width="180" height="168" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="496" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C5F8A">Rep 3</text>

  <!-- 8 observations, yet another fold assignment -->
  <rect x="422" y="80" width="32" height="20" rx="3" fill="#7B2D8E" opacity="0.6" stroke="#7B2D8E" stroke-width="0.8"/>
  <text x="438" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">3</text>
  <rect x="458" y="80" width="32" height="20" rx="3" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="474" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <rect x="494" y="80" width="32" height="20" rx="3" fill="#D55E00" opacity="0.6" stroke="#D55E00" stroke-width="0.8"/>
  <text x="510" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">2</text>
  <rect x="530" y="80" width="32" height="20" rx="3" fill="#7B2D8E" opacity="0.6" stroke="#7B2D8E" stroke-width="0.8"/>
  <text x="546" y="94" text-anchor="middle" font-size="8" fill="white" font-weight="bold">3</text>
  <!-- Row 2 -->
  <rect x="422" y="104" width="32" height="20" rx="3" fill="#D55E00" opacity="0.6" stroke="#D55E00" stroke-width="0.8"/>
  <text x="438" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">2</text>
  <rect x="458" y="104" width="32" height="20" rx="3" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="474" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <rect x="494" y="104" width="32" height="20" rx="3" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="510" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">1</text>
  <rect x="530" y="104" width="32" height="20" rx="3" fill="#D55E00" opacity="0.6" stroke="#D55E00" stroke-width="0.8"/>
  <text x="546" y="118" text-anchor="middle" font-size="8" fill="white" font-weight="bold">2</text>

  <line x1="496" y1="130" x2="496" y2="148" stroke="#555" stroke-width="1" marker-end="url(#arrowD)"/>
  <text x="496" y="162" text-anchor="middle" font-size="9" fill="#555">3-fold CV</text>
  <line x1="496" y1="168" x2="496" y2="184" stroke="#2E8B57" stroke-width="1" marker-end="url(#arrowDG)"/>
  <rect x="454" y="188" width="84" height="24" rx="4" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1.2"/>
  <text x="496" y="204" text-anchor="middle" font-size="9" fill="#2E8B57" font-weight="bold">OOF&#x2083; (n preds)</text>

  <!-- ===== CONVERGING ARROWS ===== -->
  <line x1="104" y1="212" x2="250" y2="246" stroke="#2E8B57" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="300" y1="212" x2="300" y2="246" stroke="#2E8B57" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="496" y1="212" x2="350" y2="246" stroke="#2E8B57" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- ===== OOF MATRIX ===== -->
  <rect x="200" y="248" width="200" height="80" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="300" y="266" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E8B57">oof.matrix (n &#x00d7; nrep)</text>

  <!-- Matrix grid: 6 rows × 3 cols -->
  <text x="258" y="280" text-anchor="middle" font-size="8" fill="#888">Rep 1</text>
  <text x="300" y="280" text-anchor="middle" font-size="8" fill="#888">Rep 2</text>
  <text x="342" y="280" text-anchor="middle" font-size="8" fill="#888">Rep 3</text>

  <!-- Row labels -->
  <text x="222" y="293" text-anchor="end" font-size="8" fill="#888">obs 1</text>
  <text x="222" y="305" text-anchor="end" font-size="8" fill="#888">obs 2</text>
  <text x="222" y="317" text-anchor="end" font-size="8" fill="#888">&#x22ee;</text>

  <!-- Matrix values -->
  <rect x="234" y="285" width="48" height="12" rx="2" fill="#2E8B57" opacity="0.10"/>
  <text x="258" y="294" text-anchor="middle" font-size="8" fill="#2E8B57">2.31</text>
  <rect x="276" y="285" width="48" height="12" rx="2" fill="#2E8B57" opacity="0.10"/>
  <text x="300" y="294" text-anchor="middle" font-size="8" fill="#2E8B57">2.18</text>
  <rect x="318" y="285" width="48" height="12" rx="2" fill="#2E8B57" opacity="0.10"/>
  <text x="342" y="294" text-anchor="middle" font-size="8" fill="#2E8B57">2.45</text>

  <rect x="234" y="299" width="48" height="12" rx="2" fill="#2E8B57" opacity="0.10"/>
  <text x="258" y="308" text-anchor="middle" font-size="8" fill="#2E8B57">1.05</text>
  <rect x="276" y="299" width="48" height="12" rx="2" fill="#2E8B57" opacity="0.10"/>
  <text x="300" y="308" text-anchor="middle" font-size="8" fill="#2E8B57">0.97</text>
  <rect x="318" y="299" width="48" height="12" rx="2" fill="#2E8B57" opacity="0.10"/>
  <text x="342" y="308" text-anchor="middle" font-size="8" fill="#2E8B57">1.12</text>

  <text x="258" y="322" text-anchor="middle" font-size="9" fill="#999">&#x22ee;</text>
  <text x="300" y="322" text-anchor="middle" font-size="9" fill="#999">&#x22ee;</text>
  <text x="342" y="322" text-anchor="middle" font-size="9" fill="#999">&#x22ee;</text>

  <!-- ===== AGGREGATION ARROWS ===== -->
  <line x1="260" y1="328" x2="220" y2="360" stroke="#555" stroke-width="1" marker-end="url(#arrowD)"/>
  <line x1="340" y1="328" x2="380" y2="360" stroke="#555" stroke-width="1" marker-end="url(#arrowD)"/>

  <!-- ===== AGGREGATION OUTPUTS ===== -->
  <!-- Mean predictions -->
  <rect x="136" y="364" width="170" height="36" rx="6" fill="#2E8B57" opacity="0.12" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="221" y="380" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E8B57">oof.predictions</text>
  <text x="221" y="394" text-anchor="middle" font-size="9" fill="#555">rowMeans (or majority vote)</text>

  <!-- Per-obs SD -->
  <rect x="326" y="364" width="150" height="36" rx="6" fill="#E6A020" opacity="0.15" stroke="#E6A020" stroke-width="1.5"/>
  <text x="401" y="380" text-anchor="middle" font-size="10" font-weight="bold" fill="#B37700">oof.sd</text>
  <text x="401" y="394" text-anchor="middle" font-size="9" fill="#555">per-observation SD</text>

  <!-- ===== LEGEND ===== -->
  <line x1="10" y1="414" x2="590" y2="414" stroke="#eee" stroke-width="1"/>
  <rect x="20" y="422" width="12" height="12" rx="2" fill="#4A90D9" opacity="0.7" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="36" y="432" font-size="9" fill="#555">Fold 1</text>
  <rect x="80" y="422" width="12" height="12" rx="2" fill="#D55E00" opacity="0.6" stroke="#D55E00" stroke-width="0.8"/>
  <text x="96" y="432" font-size="9" fill="#555">Fold 2</text>
  <rect x="140" y="422" width="12" height="12" rx="2" fill="#7B2D8E" opacity="0.6" stroke="#7B2D8E" stroke-width="0.8"/>
  <text x="156" y="432" font-size="9" fill="#555">Fold 3</text>
  <rect x="210" y="422" width="12" height="12" rx="2" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1"/>
  <text x="226" y="432" font-size="9" fill="#555">OOF prediction</text>
  <text x="400" y="432" font-size="9" fill="#888">Numbers = fold assignment (shuffled each rep)</text>
</svg>
