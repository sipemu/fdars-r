  <line x1="18" y1="8" x2="18" y2="100" stroke="#666" stroke-width="0.8"/>
  <!-- Labels -->
  <text x="100" y="112" text-anchor="middle" font-size="8" fill="#666" font-family="sans-serif">Time (h)</text>
  <text x="180" y="18" font-size="7" fill="#D55E00" font-family="sans-serif">Fault</text>
  <text x="180" y="58" font-size="7" fill="#009E73" font-family="sans-serif">APC</text>
</svg>
