<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <rect width="200" height="120" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Logistic curves (batch trajectories) -->
  <path d="M20,95 C40,93 60,80 80,50 C100,25 120,18 160,16" fill="none" stroke="#4A90D9" stroke-width="1.5" opacity="0.5"/>
  <path d="M20,98 C45,95 65,78 85,48 C105,22 125,15 160,13" fill="none" stroke="#4A90D9" stroke-width="1.5" opacity="0.3"/>
  <path d="M20,92 C38,90 58,75 78,45 C98,20 118,14 160,12" fill="none" stroke="#009E73" stroke-width="1.5" opacity="0.5"/>
  <path d="M20,96 C42,94 62,82 82,55 C102,30 122,22 160,20" fill="none" stroke="#E69F00" stroke-width="1.5" opacity="0.5"/>
  <!-- Fault batch (stalled) -->
