<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" fill="none" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Title -->
  <text x="350" y="20" text-anchor="middle" font-size="18.8" font-weight="bold" fill="#7B2D8E">Influence &amp; Case Deletion Diagnostics</text>
  <text x="350" y="37" text-anchor="middle" font-size="12.5" fill="#888">Which observations disproportionately affect the fitted model? (fregre.lm only)</text>

  <!-- ===== Left: Leverage + Cook's D ===== -->
  <rect x="10" y="50" width="220" height="137" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.2"/>
  <text x="120" y="70" text-anchor="middle" font-size="15.6" font-weight="bold" fill="#7B2D8E">Leverage + Cook's Distance</text>
  <text x="120" y="85" text-anchor="middle" font-size="11.0" fill="#888">fregre.influence</text>

  <!-- Axes -->
  <line x1="26" y1="172" x2="218" y2="172" stroke="#ccc" stroke-width="0.5"/>
  <line x1="26" y1="92" x2="26" y2="172" stroke="#ccc" stroke-width="0.5"/>
  <text x="122" y="185" text-anchor="middle" font-size="9.4" fill="#888">Leverage h_ii</text>
  <text x="20" y="132" text-anchor="middle" font-size="9.4" fill="#888" transform="rotate(-90, 20,132)">Cook's D</text>

  <!-- Thresholds -->
  <line x1="26" y1="122" x2="218" y2="122" stroke="#D55E00" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="220" y="120" font-size="7.8" fill="#D55E00">4/n</text>
  <line x1="160" y1="92" x2="160" y2="172" stroke="#D55E00" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="162" y="90" font-size="7.8" fill="#D55E00">2p/n</text>

  <!-- Normal cluster -->
  <circle cx="50" cy="160" r="2" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="62" cy="155" r="2" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="74" cy="162" r="2" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="82" cy="150" r="2" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="94" cy="157" r="2" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="70" cy="147" r="2" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="86" cy="165" r="2" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="102" cy="152" r="2.5" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="110" cy="145" r="2.5" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="120" cy="147" r="2" fill="#7B2D8E" opacity="0.3"/>
  <circle cx="130" cy="142" r="2.5" fill="#7B2D8E" opacity="0.3"/>
  <!-- High leverage, low Cook's -->
  <circle cx="175" cy="157" r="3" fill="#E6A020" opacity="0.6"/>
  <text x="180" y="155" font-size="7.8" fill="#E6A020">high lev.</text>
  <!-- High Cook's, low leverage -->
  <circle cx="90" cy="107" r="3" fill="#E6A020" opacity="0.6"/>
  <text x="96" y="105" font-size="7.8" fill="#E6A020">outlier</text>
  <!-- Influential: both high -->
  <circle cx="192" cy="100" r="4" fill="#D55E00" opacity="0.8" stroke="#D55E00" stroke-width="0.8"/>
  <text x="196" y="95" font-size="8.6" fill="#D55E00" font-weight="bold">influential!</text>

  <!-- ===== Middle: DFBETAS ===== -->
  <rect x="240" y="50" width="220" height="137" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.2"/>
  <text x="350" y="70" text-anchor="middle" font-size="15.6" font-weight="bold" fill="#7B2D8E">DFBETAS + DFFITS</text>
  <text x="350" y="85" text-anchor="middle" font-size="11.0" fill="#888">fregre.dfbetas</text>

  <!-- DFBETAS for one component -->
  <line x1="254" y1="172" x2="446" y2="172" stroke="#ccc" stroke-width="0.5"/>
  <line x1="254" y1="92" x2="254" y2="172" stroke="#ccc" stroke-width="0.5"/>
  <line x1="254" y1="132" x2="446" y2="132" stroke="#999" stroke-width="0.3" stroke-dasharray="3,2"/>
  <!-- Cutoffs -->
  <line x1="254" y1="105" x2="446" y2="105" stroke="#D55E00" stroke-width="0.4" stroke-dasharray="2,1" opacity="0.5"/>
  <line x1="254" y1="160" x2="446" y2="160" stroke="#D55E00" stroke-width="0.4" stroke-dasharray="2,1" opacity="0.5"/>
  <text x="448" y="107" font-size="7.8" fill="#D55E00">2/√n</text>
  <!-- Stems -->
  <line x1="268" y1="132" x2="268" y2="125" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="268" cy="125" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="282" y1="132" x2="282" y2="140" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="282" cy="140" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="296" y1="132" x2="296" y2="122" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="296" cy="122" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="310" y1="132" x2="310" y2="137" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="310" cy="137" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="324" y1="132" x2="324" y2="97" stroke="#D55E00" stroke-width="1.2"/><circle cx="324" cy="97" r="2.5" fill="#D55E00" opacity="0.8"/>
  <line x1="338" y1="132" x2="338" y2="130" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="338" cy="130" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="352" y1="132" x2="352" y2="142" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="352" cy="142" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="366" y1="132" x2="366" y2="127" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="366" cy="127" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="380" y1="132" x2="380" y2="135" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="380" cy="135" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="394" y1="132" x2="394" y2="120" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="394" cy="120" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="408" y1="132" x2="408" y2="137" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="408" cy="137" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <line x1="422" y1="132" x2="422" y2="130" stroke="#7B2D8E" stroke-width="0.8"/><circle cx="422" cy="130" r="1.5" fill="#7B2D8E" opacity="0.5"/>
  <text x="350" y="185" text-anchor="middle" font-size="9.4" fill="#888">Observation index</text>

  <!-- ===== Right: VIF ===== -->
  <rect x="470" y="50" width="222" height="137" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.2"/>
  <text x="581" y="70" text-anchor="middle" font-size="15.6" font-weight="bold" fill="#7B2D8E">Variance Inflation Factor</text>
  <text x="581" y="85" text-anchor="middle" font-size="11.0" fill="#888">fregre.vif (lm + logistic)</text>

  <!-- Axes -->
  <line x1="510" y1="172" x2="670" y2="172" stroke="#ccc" stroke-width="0.5"/>
  <line x1="510" y1="92" x2="510" y2="172" stroke="#ccc" stroke-width="0.5"/>
  <!-- VIF=5 threshold -->
  <line x1="510" y1="102" x2="670" y2="102" stroke="#D55E00" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="672" y="105" font-size="7.8" fill="#D55E00">5</text>
  <!-- VIF=1 line (ideal for orthogonal FPCs) -->
  <line x1="510" y1="165" x2="670" y2="165" stroke="#2E8B57" stroke-width="0.4" stroke-dasharray="2,1" opacity="0.4"/>
  <text x="672" y="167" font-size="7.8" fill="#2E8B57">1</text>
  <!-- Bars near 1 (good: orthogonal FPCs) -->
  <rect x="530" y="160" width="22" height="12" rx="1" fill="#2E8B57" opacity="0.4"/>
  <text x="541" y="157" text-anchor="middle" font-size="8.6" fill="#888">PC1</text>
  <rect x="560" y="157" width="22" height="15" rx="1" fill="#2E8B57" opacity="0.4"/>
  <text x="571" y="155" text-anchor="middle" font-size="8.6" fill="#888">PC2</text>
  <rect x="590" y="162" width="22" height="10" rx="1" fill="#2E8B57" opacity="0.4"/>
  <text x="601" y="160" text-anchor="middle" font-size="8.6" fill="#888">PC3</text>
  <rect x="620" y="160" width="22" height="12" rx="1" fill="#2E8B57" opacity="0.4"/>
  <text x="631" y="157" text-anchor="middle" font-size="8.6" fill="#888">PC4</text>
  <text x="581" y="185" text-anchor="middle" font-size="9.4" fill="#888">FPCs are orthogonal → VIF ≈ 1</text>
</svg>
