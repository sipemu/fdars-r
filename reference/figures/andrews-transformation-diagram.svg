<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrAT" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Andrews Transformation: From Tables to Curves</text>
  <text x="360" y="56" text-anchor="middle" font-size="14" fill="#888">f(t) = x&#8321;/&#8730;2 + x&#8322; sin(t) + x&#8323; cos(t) + x&#8324; sin(2t) + &#8230;</text>

  <!-- ===== Column 1: Tabular data ===== -->
  <rect x="16" y="84" width="180" height="200" rx="8" fill="#F8F8F8" stroke="#888" stroke-width="1.5"/>
  <text x="106" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">Tabular Data</text>
  <text x="106" y="132" text-anchor="middle" font-size="13" fill="#888">p-dimensional observations</text>

  <!-- Mini table -->
  <line x1="32" y1="148" x2="180" y2="148" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="166" font-size="12" font-weight="bold" fill="#555">x&#8321;</text>
  <text x="88" y="166" font-size="12" font-weight="bold" fill="#555">x&#8322;</text>
  <text x="126" y="166" font-size="12" font-weight="bold" fill="#555">x&#8323;</text>
  <text x="164" y="166" font-size="12" font-weight="bold" fill="#555">x&#8324;</text>
  <line x1="32" y1="174" x2="180" y2="174" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="192" font-size="11" fill="#E41A1C">5.1</text>
  <text x="88" y="192" font-size="11" fill="#E41A1C">3.5</text>
  <text x="126" y="192" font-size="11" fill="#E41A1C">1.4</text>
  <text x="164" y="192" font-size="11" fill="#E41A1C">0.2</text>
  <text x="50" y="210" font-size="11" fill="#377EB8">7.0</text>
  <text x="88" y="210" font-size="11" fill="#377EB8">3.2</text>
  <text x="126" y="210" font-size="11" fill="#377EB8">4.7</text>
  <text x="164" y="210" font-size="11" fill="#377EB8">1.4</text>
  <text x="50" y="228" font-size="11" fill="#4DAF4A">6.3</text>
  <text x="88" y="228" font-size="11" fill="#4DAF4A">3.3</text>
  <text x="126" y="228" font-size="11" fill="#4DAF4A">6.0</text>
  <text x="164" y="228" font-size="11" fill="#4DAF4A">2.5</text>
  <text x="106" y="260" text-anchor="middle" font-size="12" fill="#888">&#8942;</text>
  <text x="106" y="276" text-anchor="middle" font-size="12" fill="#888">n rows &#215; p cols</text>

  <!-- Arrow to transform -->
  <line x1="200" y1="184" x2="248" y2="184" stroke="#555" stroke-width="1.5" marker-end="url(#arrAT)"/>

  <!-- ===== Column 2: Transformation ===== -->
  <rect x="256" y="104" width="190" height="160" rx="8" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="2"/>
  <text x="351" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#7B2D8E">andrews_transform()</text>
  <text x="351" y="156" text-anchor="middle" font-size="13" fill="#555">Fourier basis expansion</text>
  <text x="351" y="178" text-anchor="middle" font-size="12" fill="#888">t &#8712; [-&#960;, &#960;]</text>

  <!-- Fourier terms -->
  <text x="351" y="204" text-anchor="middle" font-size="12" fill="#7B2D8E">1/&#8730;2, sin(t), cos(t),</text>
  <text x="351" y="222" text-anchor="middle" font-size="12" fill="#7B2D8E">sin(2t), cos(2t), &#8230;</text>

  <!-- Key property box -->
  <rect x="262" y="280" width="178" height="56" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.5"/>
  <text x="351" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#B37700">Distance Preserved</text>
  <text x="351" y="322" text-anchor="middle" font-size="12" fill="#555">&#8214;f&#8339; - f&#8347;&#8214;&#8322; = &#8730;&#960; &#183; &#8214;x - y&#8214;&#8322;</text>

  <!-- Arrow to output -->
  <line x1="450" y1="184" x2="498" y2="184" stroke="#555" stroke-width="1.5" marker-end="url(#arrAT)"/>

  <!-- ===== Column 3: Andrews curves ===== -->
  <rect x="504" y="84" width="200" height="200" rx="8" fill="#F0FAF0" stroke="#2E8B57" stroke-width="2"/>
  <text x="604" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E8B57">Andrews Curves</text>
  <text x="604" y="132" text-anchor="middle" font-size="13" fill="#888">fdata object</text>

  <!-- Stylized Andrews curves by group -->
  <!-- Group 1 (red) -->
  <path d="M520 180 Q545 160 570 170 Q595 180 620 168 Q645 156 670 162 Q688 168 692 166" stroke="#E41A1C" stroke-width="1.8" fill="none" opacity="0.5"/>
  <path d="M520 186 Q545 168 570 176 Q595 184 620 174 Q645 162 670 168 Q688 174 692 172" stroke="#E41A1C" stroke-width="1.3" fill="none" opacity="0.35"/>
  <!-- Group 2 (blue) -->
  <path d="M520 208 Q545 192 570 200 Q595 216 620 206 Q645 196 670 204 Q688 210 692 208" stroke="#377EB8" stroke-width="1.8" fill="none" opacity="0.5"/>
  <path d="M520 214 Q545 198 570 206 Q595 222 620 212 Q645 202 670 210 Q688 216 692 214" stroke="#377EB8" stroke-width="1.3" fill="none" opacity="0.35"/>
  <!-- Group 3 (green) -->
  <path d="M520 236 Q545 248 570 240 Q595 228 620 240 Q645 250 670 244 Q688 238 692 240" stroke="#4DAF4A" stroke-width="1.8" fill="none" opacity="0.5"/>
  <path d="M520 242 Q545 254 570 246 Q595 234 620 246 Q645 256 670 250 Q688 244 692 246" stroke="#4DAF4A" stroke-width="1.3" fill="none" opacity="0.35"/>

  <text x="604" y="274" text-anchor="middle" font-size="12" fill="#888">t &#8712; [-&#960;, &#960;]</text>

  <!-- ===== Bottom: FDA Pipeline ===== -->
  <line x1="16" y1="360" x2="704" y2="360" stroke="#eee" stroke-width="1.5"/>
  <text x="360" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">Full FDA Toolbox on Andrews Curves</text>

  <!-- Pipeline boxes -->
  <rect x="24" y="400" width="110" height="56" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="79" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C5F8A">Depth</text>
  <text x="79" y="440" text-anchor="middle" font-size="11" fill="#555">FM, MBD, RP</text>

  <rect x="150" y="400" width="110" height="56" rx="6" fill="#FFE8E8" stroke="#D55E00" stroke-width="1.2"/>
  <text x="205" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#D55E00">Outliers</text>
  <text x="205" y="440" text-anchor="middle" font-size="11" fill="#555">outliergram</text>

  <rect x="276" y="400" width="110" height="56" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.2"/>
  <text x="331" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#7B2D8E">Clustering</text>
  <text x="331" y="440" text-anchor="middle" font-size="11" fill="#555">k-means, FCM</text>

  <rect x="402" y="400" width="110" height="56" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2"/>
  <text x="457" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#B37700">FPCA</text>
  <text x="457" y="440" text-anchor="middle" font-size="11" fill="#555">fdata2pc</text>

  <rect x="528" y="400" width="110" height="56" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.2"/>
  <text x="583" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E8B57">Tolerance</text>
  <text x="583" y="440" text-anchor="middle" font-size="11" fill="#555">bands, boxplot</text>

  <!-- Connecting arrows from curves box down to pipeline -->
  <line x1="604" y1="288" x2="604" y2="340" stroke="#555" stroke-width="1.2"/>
  <line x1="604" y1="340" x2="79" y2="340" stroke="#555" stroke-width="0.8" stroke-dasharray="4"/>
  <line x1="604" y1="340" x2="583" y2="340" stroke="#555" stroke-width="0.8" stroke-dasharray="4"/>
  <line x1="79" y1="340" x2="79" y2="396" stroke="#555" stroke-width="1.2" marker-end="url(#arrAT)"/>
  <line x1="205" y1="340" x2="205" y2="396" stroke="#555" stroke-width="1.2" marker-end="url(#arrAT)"/>
  <line x1="331" y1="340" x2="331" y2="396" stroke="#555" stroke-width="1.2" marker-end="url(#arrAT)"/>
  <line x1="457" y1="340" x2="457" y2="396" stroke="#555" stroke-width="1.2" marker-end="url(#arrAT)"/>
  <line x1="583" y1="340" x2="583" y2="396" stroke="#555" stroke-width="1.2" marker-end="url(#arrAT)"/>
</svg>
