<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Model-Based Clustering with Gaussian Mixtures</text>
  <text x="360" y="54" text-anchor="middle" font-size="14" fill="#888">Soft probabilistic assignment via EM on basis coefficients</text>

  <!-- ===== Left: Input curves ===== -->
  <rect x="16" y="80" width="180" height="160" rx="8" fill="#F8F8F8" stroke="#888" stroke-width="1.5"/>
  <text x="106" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">Functional Data</text>
  <!-- Curves cluster 1 (blue) -->
  <path d="M32 150 Q56 125 80 135 Q104 145 128 130 Q152 120 180 128" stroke="#4A90D9" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M32 158 Q56 130 80 142 Q104 155 128 138 Q152 125 180 135" stroke="#4A90D9" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Curves cluster 2 (orange) -->
  <path d="M32 180 Q56 200 80 190 Q104 180 128 195 Q152 205 180 195" stroke="#E6A020" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M32 188 Q56 205 80 198 Q104 185 128 200 Q152 210 180 202" stroke="#E6A020" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Curves cluster 3 (green) -->
  <path d="M32 210 Q80 215 128 220 Q152 222 180 225" stroke="#2E8B57" stroke-width="1.5" fill="none" opacity="0.6"/>
  <text x="106" y="228" text-anchor="middle" font-size="11" fill="#888">n curves</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="160" x2="224" y2="160" stroke="#555" stroke-width="1.2" marker-end="url(#arrGMM)"/>

  <!-- ===== Middle: B-spline projection ===== -->
  <rect x="228" y="80" width="160" height="160" rx="8" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="308" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5F8A">B-spline Basis</text>
  <text x="308" y="124" text-anchor="middle" font-size="12" fill="#555">Project curves onto</text>
  <text x="308" y="140" text-anchor="middle" font-size="12" fill="#555">K basis functions</text>
  <!-- Basis functions sketch -->
  <path d="M248 170 Q268 150 288 170 Q308 190 328 170" stroke="#4A90D9" stroke-width="1.2" fill="none"/>
  <path d="M268 180 Q288 158 308 180 Q328 200 348 180" stroke="#7B2D8E" stroke-width="1.2" fill="none"/>
  <path d="M288 185 Q308 165 328 185 Q348 205 368 185" stroke="#2E8B57" stroke-width="1.2" fill="none"/>
  <text x="308" y="218" text-anchor="middle" font-size="12" fill="#555">&#x2192; coefficient vectors</text>

  <!-- Arrow 2 -->
  <line x1="392" y1="160" x2="416" y2="160" stroke="#555" stroke-width="1.2" marker-end="url(#arrGMM)"/>

  <!-- ===== Right: GMM ===== -->
  <rect x="420" y="80" width="284" height="160" rx="8" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.5"/>
  <text x="562" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#B37700">EM Algorithm</text>
  <text x="440" y="128" font-size="12" fill="#555">E-step: compute responsibilities</text>
  <text x="440" y="148" font-size="12" fill="#555">  &#x03C4;&#x1D62;&#x2096; = P(curve i &#x2208; cluster k)</text>
  <text x="440" y="172" font-size="12" fill="#555">M-step: update parameters</text>
  <text x="440" y="192" font-size="12" fill="#555">  &#x03BC;&#x2096;, &#x03A3;&#x2096;, &#x03C0;&#x2096; for each cluster</text>
  <text x="440" y="218" font-size="12" fill="#555">Select K via BIC / ICL</text>

  <!-- ===== Bottom: Outputs ===== -->
  <line x1="16" y1="260" x2="704" y2="260" stroke="#eee" stroke-width="1.5"/>
  <text x="360" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">Outputs</text>

  <!-- Output 1: Soft assignment -->
  <rect x="24" y="306" width="210" height="80" rx="8" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.5"/>
  <text x="129" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B2D8E">Soft Assignment</text>
  <text x="44" y="350" font-size="12" fill="#555">&#x03C4;&#x1D62;&#x2096; &#x2208; [0, 1] per curve</text>
  <text x="44" y="368" font-size="12" fill="#555">Quantifies uncertainty</text>

  <!-- Output 2: Model selection -->
  <rect x="254" y="306" width="210" height="80" rx="8" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="359" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E8B57">Model Selection</text>
  <text x="274" y="350" font-size="12" fill="#555">BIC selects best K</text>
  <text x="274" y="368" font-size="12" fill="#555">Full / diag / spherical cov</text>

  <!-- Output 3: Cluster means -->
  <rect x="484" y="306" width="220" height="80" rx="8" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="594" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5F8A">Cluster Centroids</text>
  <text x="504" y="350" font-size="12" fill="#555">Mean curve per cluster</text>
  <text x="504" y="368" font-size="12" fill="#555">predict() for new curves</text>

  <!-- ===== Bottom bar: vs k-means ===== -->
  <line x1="16" y1="406" x2="704" y2="406" stroke="#eee" stroke-width="1.5"/>
  <text x="360" y="434" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">GMM vs K-means</text>

  <rect x="24" y="446" width="220" height="28" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2"/>
  <text x="134" y="465" text-anchor="middle" font-size="12" fill="#B37700">Soft assignment + uncertainty</text>

  <rect x="254" y="446" width="220" height="28" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2"/>
  <text x="364" y="465" text-anchor="middle" font-size="12" fill="#B37700">Flexible covariance shapes</text>

  <rect x="484" y="446" width="220" height="28" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2"/>
  <text x="594" y="465" text-anchor="middle" font-size="12" fill="#B37700">Automatic K via BIC/ICL</text>

  <defs>
    <marker id="arrGMM" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#555"/>
    </marker>
  </defs>
</svg>
