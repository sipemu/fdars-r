<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 387" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrBR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="27.5" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Basis Representation: X(t) = &#931; c&#8342; B&#8342;(t)</text>
  <text x="300" y="50" text-anchor="middle" font-size="12.5" fill="#888">Represent curves as weighted sums of basis functions</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="300" y1="65" x2="300" y2="285" stroke="#ddd" stroke-width="1.6" stroke-dasharray="6,4"/>

  <!-- ===== LEFT: B-splines ===== -->
  <text x="150" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C5F8A">B-spline Basis</text>

  <!-- B-spline basis functions (local bumps) -->
  <rect x="20" y="95" width="260" height="85" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="150" y="115" text-anchor="middle" font-size="11.2" fill="#2C5F8A" font-weight="bold">Basis functions (local support)</text>

  <!-- 5 overlapping bumps across the domain -->
  <path d="M 34 165.0 Q 42 160.0 50 137.5 Q 58 115.0 66 137.5 Q 74 160.0 82 165.0" stroke="#4A90D9" stroke-width="1.6" fill="#4A90D9" fill-opacity="0.08"/>
  <path d="M 66 165.0 Q 74 160.0 82 132.5 Q 90 100.0 98 132.5 Q 106 160.0 114 165.0" stroke="#0072B2" stroke-width="1.6" fill="#0072B2" fill-opacity="0.08"/>
  <path d="M 98 165.0 Q 106 160.0 114 140.0 Q 122 115.0 130 140.0 Q 138 160.0 146 165.0" stroke="#4A90D9" stroke-width="1.6" fill="#4A90D9" fill-opacity="0.08"/>
  <path d="M 130 165.0 Q 138 160.0 146 135.0 Q 154 110.0 162 135.0 Q 170 160.0 178 165.0" stroke="#0072B2" stroke-width="1.6" fill="#0072B2" fill-opacity="0.08"/>
  <path d="M 162 165.0 Q 170 160.0 178 142.5 Q 186 120.0 194 142.5 Q 202 160.0 210 165.0" stroke="#4A90D9" stroke-width="1.6" fill="#4A90D9" fill-opacity="0.08"/>
  <path d="M 194 165.0 Q 202 160.0 210 132.5 Q 218 105.0 226 132.5 Q 234 160.0 242 165.0" stroke="#0072B2" stroke-width="1.6" fill="#0072B2" fill-opacity="0.08"/>

  <!-- Coefficients c_k -->
  <rect x="20" y="187.5" width="260" height="37.5" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.1"/>
  <text x="36" y="210" font-size="11.2" fill="#B37700" font-weight="bold">c&#8342;:</text>
  <rect x="52" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.3"/>
  <text x="66" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">0.8</text>
  <rect x="84" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.5"/>
  <text x="98" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">1.5</text>
  <rect x="116" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.2"/>
  <text x="130" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">0.3</text>
  <rect x="148" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.6"/>
  <text x="162" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">1.9</text>
  <rect x="180" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.35"/>
  <text x="194" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">1.0</text>
  <rect x="212" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.15"/>
  <text x="226" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">0.2</text>

  <!-- Properties -->
  <rect x="20" y="235" width="260" height="47.5" rx="4" fill="#F0FAF0" stroke="#2E8B57" stroke-width="0.9"/>
  <text x="150" y="255" text-anchor="middle" font-size="11.2" fill="#2E8B57" font-weight="bold">Best for non-periodic data</text>
  <text x="150" y="272.5" text-anchor="middle" font-size="10" fill="#555">Local support &#8594; captures local features efficiently</text>

  <!-- ===== RIGHT: Fourier ===== -->
  <text x="450" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#7B2D8E">Fourier Basis</text>

  <!-- Fourier basis functions (global waves) -->
  <rect x="320" y="95" width="260" height="85" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.1"/>
  <text x="450" y="115" text-anchor="middle" font-size="11.2" fill="#7B2D8E" font-weight="bold">Basis functions (global support)</text>

  <!-- Sine/cosine waves across full domain -->
  <!-- Constant -->
  <line x1="334" y1="145" x2="566" y2="145" stroke="#7B2D8E" stroke-width="1.1" opacity="0.3"/>
  <!-- sin(2pi t) -->
  <path d="M 334 145.0 Q 358 120.0 382 145.0 Q 406 170.0 430 145.0 Q 454 120.0 478 145.0 Q 502 170.0 526 145.0 Q 542 127.5 566 145.0" stroke="#7B2D8E" stroke-width="1.6" fill="none" opacity="0.5"/>
  <!-- cos(2pi t) -->
  <path d="M 334 125.0 Q 358 145.0 382 165.0 Q 406 145.0 430 125.0 Q 454 145.0 478 165.0 Q 502 145.0 526 125.0 Q 542 140.0 566 157.5" stroke="#9B59B6" stroke-width="1.6" fill="none" opacity="0.35"/>
  <!-- sin(4pi t) - higher freq -->
  <path d="M 334 145.0 Q 346 132.5 358 145.0 Q 370 157.5 382 145.0 Q 394 132.5 406 145.0 Q 418 157.5 430 145.0 Q 442 132.5 454 145.0 Q 466 157.5 478 145.0 Q 490 132.5 502 145.0 Q 514 157.5 526 145.0 Q 538 132.5 550 145.0 Q 558 157.5 566 145.0" stroke="#7B2D8E" stroke-width="1.3" fill="none" opacity="0.25"/>

  <!-- Coefficients -->
  <rect x="320" y="187.5" width="260" height="37.5" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.1"/>
  <text x="336" y="210" font-size="11.2" fill="#B37700" font-weight="bold">c&#8342;:</text>
  <rect x="352" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.5"/>
  <text x="366" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">a&#8320;</text>
  <rect x="388" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.6"/>
  <text x="402" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">a&#8321;</text>
  <rect x="424" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.4"/>
  <text x="438" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">b&#8321;</text>
  <rect x="460" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.3"/>
  <text x="474" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">a&#8322;</text>
  <rect x="496" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.15"/>
  <text x="510" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">b&#8322;</text>
  <rect x="532" y="195" width="28" height="22.5" rx="3" fill="#E6A020" opacity="0.1"/>
  <text x="546" y="211.2" text-anchor="middle" font-size="10" fill="#B37700">&#8230;</text>

  <!-- Properties -->
  <rect x="320" y="235" width="260" height="47.5" rx="4" fill="#F0FAF0" stroke="#2E8B57" stroke-width="0.9"/>
  <text x="450" y="255" text-anchor="middle" font-size="11.2" fill="#2E8B57" font-weight="bold">Best for periodic/seasonal data</text>
  <text x="450" y="272.5" text-anchor="middle" font-size="10" fill="#555">Global support &#8594; natural harmonic decomposition</text>

  <!-- ===== BOTTOM: Common output ===== -->
  <line x1="10" y1="300" x2="590" y2="300" stroke="#eee" stroke-width="1.1"/>

  <!-- Arrows converging -->
  <line x1="150" y1="282.5" x2="255" y2="325" stroke="#555" stroke-width="1.1" stroke-dasharray="3,2"/>
  <line x1="450" y1="282.5" x2="345" y2="325" stroke="#555" stroke-width="1.1" stroke-dasharray="3,2"/>

  <!-- Result: smooth curve -->
  <rect x="210" y="317.5" width="180" height="55" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="300" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E8B57">Smooth Curve &#7820;(t)</text>
  <text x="300" y="360" text-anchor="middle" font-size="10" fill="#555">Noise removed, derivatives computable</text>
</svg>
