<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrSD" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="27.5" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Streaming Depth: O(T log N) Per Query Curve</text>

  <!-- ===== STEP 1: Reference curves ===== -->
  <rect x="14" y="52.5" width="140" height="150" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.3"/>
  <text x="84" y="72.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C5F8A">Reference Set</text>
  <text x="84" y="87.5" text-anchor="middle" font-size="10" fill="#888">N curves on T grid points</text>

  <!-- Multiple faded curves -->
  <path d="M 24 137.5 Q 44 112.5 64 125.0 Q 84 137.5 104 118.8 Q 124 100.0 144 131.2" stroke="#4A90D9" stroke-width="1.1" fill="none" opacity="0.3"/>
  <path d="M 24 143.8 Q 44 118.8 64 127.5 Q 84 140.0 104 125.0 Q 124 110.0 144 137.5" stroke="#4A90D9" stroke-width="1.1" fill="none" opacity="0.4"/>
  <path d="M 24 135.0 Q 44 110.0 64 122.5 Q 84 135.0 104 115.0 Q 124 95.0 144 125.0" stroke="#4A90D9" stroke-width="1.1" fill="none" opacity="0.5"/>
  <path d="M 24 147.5 Q 44 122.5 64 132.5 Q 84 145.0 104 130.0 Q 124 115.0 144 142.5" stroke="#4A90D9" stroke-width="1.1" fill="none" opacity="0.35"/>
  <path d="M 24 140.0 Q 44 115.0 64 125.0 Q 84 137.5 104 122.5 Q 124 105.0 144 135.0" stroke="#4A90D9" stroke-width="1.1" fill="none" opacity="0.45"/>
  <text x="84" y="185" text-anchor="middle" font-size="10" fill="#888">X&#8321;(t), ..., X&#8345;(t)</text>

  <!-- Arrow: pre-sort -->
  <line x1="158" y1="125" x2="188" y2="125" stroke="#555" stroke-width="1.3" marker-end="u r l a r r S D"/>
  <text x="173" y="112.5" text-anchor="middle" font-size="8.8" fill="#888">pre-sort</text>
  <text x="173" y="147.5" text-anchor="middle" font-size="8.8" fill="#888">at each t&#11388;</text>

  <!-- ===== STEP 2: Sorted columns ===== -->
  <rect x="194" y="52.5" width="140" height="150" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3"/>
  <text x="264" y="72.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B37700">Sorted Index</text>
  <text x="264" y="87.5" text-anchor="middle" font-size="10" fill="#888">O(NT log N) one-time</text>

  <!-- Sorted columns visualization -->
  <rect x="208" y="100" width="20" height="85" rx="2" fill="#E6A020" opacity="0.15" stroke="#E6A020" stroke-width="0.6"/>
  <rect x="232" y="100" width="20" height="85" rx="2" fill="#E6A020" opacity="0.15" stroke="#E6A020" stroke-width="0.6"/>
  <rect x="256" y="100" width="20" height="85" rx="2" fill="#E6A020" opacity="0.15" stroke="#E6A020" stroke-width="0.6"/>
  <rect x="280" y="100" width="20" height="85" rx="2" fill="#E6A020" opacity="0.15" stroke="#E6A020" stroke-width="0.6"/>
  <rect x="304" y="100" width="20" height="85" rx="2" fill="#E6A020" opacity="0.15" stroke="#E6A020" stroke-width="0.6"/>

  <!-- Column labels -->
  <text x="218" y="97.5" text-anchor="middle" font-size="7.5" fill="#B37700">t&#8321;</text>
  <text x="242" y="97.5" text-anchor="middle" font-size="7.5" fill="#B37700">t&#8322;</text>
  <text x="266" y="97.5" text-anchor="middle" font-size="7.5" fill="#B37700">t&#8323;</text>
  <text x="290" y="97.5" text-anchor="middle" font-size="7.5" fill="#B37700">...</text>
  <text x="314" y="97.5" text-anchor="middle" font-size="7.5" fill="#B37700">t&#8346;</text>

  <!-- Sorted values in columns -->
  <text x="218" y="117.5" text-anchor="middle" font-size="7.5" fill="#555">0.1</text>
  <text x="218" y="132.5" text-anchor="middle" font-size="7.5" fill="#555">0.3</text>
  <text x="218" y="147.5" text-anchor="middle" font-size="7.5" fill="#555">0.5</text>
  <text x="218" y="162.5" text-anchor="middle" font-size="7.5" fill="#555">0.8</text>
  <text x="218" y="177.5" text-anchor="middle" font-size="7.5" fill="#555">1.2</text>

  <text x="242" y="117.5" text-anchor="middle" font-size="7.5" fill="#555">-0.2</text>
  <text x="242" y="132.5" text-anchor="middle" font-size="7.5" fill="#555">0.1</text>
  <text x="242" y="147.5" text-anchor="middle" font-size="7.5" fill="#555">0.4</text>
  <text x="242" y="162.5" text-anchor="middle" font-size="7.5" fill="#555">0.6</text>
  <text x="242" y="177.5" text-anchor="middle" font-size="7.5" fill="#555">0.9</text>

  <text x="264" y="185" text-anchor="middle" font-size="8.8" fill="#B37700">Binary search ready</text>

  <!-- Arrow: query -->
  <line x1="338" y1="125" x2="368" y2="125" stroke="#555" stroke-width="1.3" marker-end="u r l a r r S D"/>
  <text x="353" y="112.5" text-anchor="middle" font-size="8.8" fill="#888">query</text>

  <!-- ===== STEP 3: Query + depth ===== -->
  <rect x="374" y="52.5" width="212" height="150" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.3"/>
  <text x="480" y="72.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E8B57">Per-Query Depth</text>
  <text x="480" y="87.5" text-anchor="middle" font-size="10" fill="#888">O(T log N) per curve</text>

  <!-- Query curve -->
  <path d="M 384 143.8 Q 412 112.5 440 127.5 Q 468 142.5 496 118.8 Q 524 95.0 552 135.0 Q 570 147.5 576 140.0" stroke="#D55E00" stroke-width="2.1" fill="none"/>
  <text x="400" y="162.5" font-size="8.8" fill="#D55E00">New curve X(t)</text>

  <!-- Binary search at each t -->
  <line x1="440" y1="127.5" x2="440" y2="180" stroke="#2E8B57" stroke-width="0.9" stroke-dasharray="2,2"/>
  <text x="440" y="190" text-anchor="middle" font-size="7.5" fill="#2E8B57">rank&#8323;</text>

  <line x1="496" y1="118.8" x2="496" y2="180" stroke="#2E8B57" stroke-width="0.9" stroke-dasharray="2,2"/>
  <text x="496" y="190" text-anchor="middle" font-size="7.5" fill="#2E8B57">rank&#8324;</text>

  <line x1="552" y1="135" x2="552" y2="180" stroke="#2E8B57" stroke-width="0.9" stroke-dasharray="2,2"/>
  <text x="552" y="190" text-anchor="middle" font-size="7.5" fill="#2E8B57">rank&#8346;</text>

  <!-- ===== BOTTOM: Use cases ===== -->
  <line x1="10" y1="222.5" x2="590" y2="222.5" stroke="#eee" stroke-width="1.1"/>
  <text x="300" y="247.5" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#555">Complexity Comparison</text>

  <!-- Standard depth box -->
  <rect x="30" y="262.5" width="250" height="60" rx="5" fill="#FFE8E8" stroke="#d62728" stroke-width="1.1"/>
  <text x="155" y="285" text-anchor="middle" font-size="11.2" fill="#d62728" font-weight="bold">Standard Depth</text>
  <text x="155" y="305" text-anchor="middle" font-size="11.2" fill="#555">O(N&#8901;T) per query &#8594; slow for large N</text>

  <!-- Streaming depth box -->
  <rect x="320" y="262.5" width="250" height="60" rx="5" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.1"/>
  <text x="445" y="285" text-anchor="middle" font-size="11.2" fill="#2E8B57" font-weight="bold">Streaming Depth</text>
  <text x="445" y="305" text-anchor="middle" font-size="11.2" fill="#555">O(T log N) per query &#8594; fast lookups</text>

  <!-- Use cases -->
  <text x="300" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">Applications</text>

  <rect x="30" y="362.5" width="160" height="30" rx="4" fill="#E8F0FE" stroke="#4A90D9" stroke-width="0.9"/>
  <text x="110" y="382.5" text-anchor="middle" font-size="10" fill="#2C5F8A">Online monitoring</text>

  <rect x="220" y="362.5" width="160" height="30" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="0.9"/>
  <text x="300" y="382.5" text-anchor="middle" font-size="10" fill="#B37700">Outlier detection</text>

  <rect x="410" y="362.5" width="160" height="30" rx="4" fill="#F0FAF0" stroke="#2E8B57" stroke-width="0.9"/>
  <text x="490" y="382.5" text-anchor="middle" font-size="10" fill="#2E8B57">Process control</text>
</svg>
