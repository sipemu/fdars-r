<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrDV" markerWidth="6" markerHeight="8" refX="3" refY="7" orient="auto">
      <path d="M0,0 L3,8 L6,0" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="27.5" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Noise Amplifies with Differentiation</text>
  <text x="300" y="50" text-anchor="middle" font-size="12.5" fill="#888">Why smoothing before differentiation is essential</text>

  <!-- ===== ROW 1: Original curve ===== -->
  <rect x="14" y="67.5" width="572" height="87.5" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="50" y="90" font-size="12.5" font-weight="bold" fill="#2C5F8A">f(t)</text>
  <text x="50" y="105" font-size="10" fill="#888">height</text>

  <!-- Smooth growth curve with subtle noise dots -->
  <path d="M 90 135.0 Q 140 130.0 190 120.0 Q 240 107.5 290 95.0 Q 340 85.0 390 80.0 Q 440 77.5 490 75.0 Q 530 73.8 564 72.5" stroke="#4A90D9" stroke-width="2.1" fill="none"/>
  <!-- Noise dots -->
  <circle cx="110" cy="133.8" r="1.5" fill="#4A90D9" opacity="0.3"/>
  <circle cx="160" cy="126.2" r="1.5" fill="#4A90D9" opacity="0.3"/>
  <circle cx="210" cy="116.2" r="1.5" fill="#4A90D9" opacity="0.3"/>
  <circle cx="260" cy="102.5" r="1.5" fill="#4A90D9" opacity="0.3"/>
  <circle cx="310" cy="92.5" r="1.5" fill="#4A90D9" opacity="0.3"/>
  <circle cx="360" cy="83.8" r="1.5" fill="#4A90D9" opacity="0.3"/>
  <circle cx="410" cy="78.8" r="1.5" fill="#4A90D9" opacity="0.3"/>
  <circle cx="460" cy="76.2" r="1.5" fill="#4A90D9" opacity="0.3"/>
  <circle cx="510" cy="73.8" r="1.5" fill="#4A90D9" opacity="0.3"/>

  <text x="300" y="147.5" text-anchor="middle" font-size="10" fill="#888">signal clear, noise barely visible</text>

  <!-- Arrow down: naive derivative -->
  <line x1="200" y1="155" x2="200" y2="175" stroke="#D55E00" stroke-width="1.1" marker-end="u r l a r r D V"/>
  <text x="204" y="171.2" font-size="8.8" fill="#D55E00">d/dt (raw)</text>

  <!-- Arrow down: smooth then derivative -->
  <line x1="440" y1="155" x2="440" y2="175" stroke="#2E8B57" stroke-width="1.1" marker-end="u r l a r r D V"/>
  <text x="444" y="171.2" font-size="8.8" fill="#2E8B57">smooth + d/dt</text>

  <!-- ===== ROW 2 LEFT: Noisy derivative ===== -->
  <rect x="14" y="182.5" width="276" height="112.5" rx="6" fill="#FFE8E8" stroke="#D55E00" stroke-width="1.3"/>
  <text x="40" y="205" font-size="12.5" font-weight="bold" fill="#D55E00">f'(t)</text>
  <text x="80" y="205" font-size="10" fill="#888">raw derivative</text>

  <!-- Very noisy spiky derivative -->
  <path d="M 28 262.5 L 38 237.5 L 48 272.5 L 58 232.5 L 68 270.0 L 78 235.0 L 88 267.5 L 98 240.0 L 108 262.5 L 118 242.5 L 128 260.0 L 138 245.0 L 148 257.5 L 158 250.0 L 168 255.0 L 178 252.5 L 188 255.0 L 198 250.0 L 208 257.5 L 218 247.5 L 228 260.0 L 238 245.0 L 248 262.5 L 258 242.5 L 268 265.0 L 278 245.0" stroke="#D55E00" stroke-width="1.6" fill="none"/>

  <text x="152" y="285" text-anchor="middle" font-size="10" fill="#D55E00" font-weight="bold">noise dominates signal!</text>

  <!-- ===== ROW 2 RIGHT: Clean derivative ===== -->
  <rect x="310" y="182.5" width="276" height="112.5" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.3"/>
  <text x="336" y="205" font-size="12.5" font-weight="bold" fill="#2E8B57">f'(t)</text>
  <text x="384" y="205" font-size="10" fill="#888">smoothed derivative</text>

  <!-- Clean velocity curve: high early, low late (growth decelerating) -->
  <path d="M 324 225.0 Q 354 220.0 384 232.5 Q 414 245.0 444 255.0 Q 474 262.5 504 270.0 Q 534 275.0 574 277.5" stroke="#2E8B57" stroke-width="2.1" fill="none"/>

  <!-- Peak velocity annotation -->
  <circle cx="340" cy="222.5" r="3" fill="#2E8B57" opacity="0.5"/>
  <text x="360" y="220" font-size="8.8" fill="#2E8B57">peak velocity</text>

  <text x="450" y="285" text-anchor="middle" font-size="10" fill="#2E8B57" font-weight="bold">true growth rate revealed</text>

  <!-- ===== BOTTOM: Key insight ===== -->
  <line x1="10" y1="312.5" x2="590" y2="312.5" stroke="#eee" stroke-width="1.1"/>

  <rect x="30" y="325" width="540" height="60" rx="5" fill="#F8F8F8" stroke="#ccc" stroke-width="1.1"/>
  <text x="300" y="347.5" text-anchor="middle" font-size="11.2" fill="#555">Differentiation amplifies high-frequency noise by a factor of <tspan font-weight="bold">O(1/&#916;t)</tspan>.</text>
  <text x="300" y="367.5" text-anchor="middle" font-size="11.2" fill="#555">Always <tspan font-weight="bold" fill="#2E8B57">smooth first</tspan> (basis expansion or kernel smoother), then differentiate the smooth estimate.</text>
</svg>
