<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Beta(t) coefficient function with two active regions -->
  <!-- Zero baseline -->
  <line x1="15" y1="65" x2="185" y2="65" stroke="#999" stroke-width="0.5" stroke-dasharray="3,3"/>
  <!-- Region A: positive bump [0.2, 0.35] -->
  <rect x="49" y="35" width="25" height="30" fill="#4169E1" opacity="0.15" rx="2"/>
  <path d="M15 65 L49 65 Q55 65, 58 45 L63 45 Q68 45, 74 65 L185 65" stroke="#333" stroke-width="0" fill="none"/>
  <!-- Region B: negative bump [0.65, 0.8] -->
  <rect x="121" y="65" width="26" height="25" fill="#DC3545" opacity="0.15" rx="2"/>
  <!-- Beta curve -->
  <path d="M15 65 L45 65 Q49 65, 52 42 L68 42 Q74 42, 74 65 L117 65 Q121 65, 124 82 L141 82 Q147 82, 147 65 L185 65" stroke="#4169E1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Importance peaks below -->
  <path d="M15 105 L45 105 Q52 105, 55 90 L65 88 Q72 88, 74 105 L117 105 Q124 105, 127 92 L138 90 Q145 90, 147 105 L185 105" stroke="#E8913A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Region labels -->
  <text x="61" y="28" font-size="7" fill="#4169E1" text-anchor="middle" font-family="sans-serif" font-weight="bold">A</text>
  <text x="134" y="28" font-size="7" fill="#DC3545" text-anchor="middle" font-family="sans-serif" font-weight="bold">B</text>
  <!-- Axis labels -->
  <text x="100" y="115" font-size="5" fill="#666" text-anchor="middle" font-family="sans-serif">domain t</text>
  <text x="8" y="42" font-size="5" fill="#4169E1" text-anchor="middle" font-family="sans-serif">+</text>
  <text x="8" y="85" font-size="5" fill="#DC3545" text-anchor="middle" font-family="sans-serif">-</text>
</svg>
