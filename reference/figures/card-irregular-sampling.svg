  <circle cx="22" cy="79" r="4" fill="#0d6efd"/>
  <circle cx="38" cy="58" r="4" fill="#0d6efd"/>
  <circle cx="42" cy="52" r="4" fill="#0d6efd"/>
  <circle cx="68" cy="32" r="4" fill="#0d6efd"/>
  <circle cx="95" cy="52" r="4" fill="#0d6efd"/>
  <circle cx="98" cy="54" r="4" fill="#0d6efd"/>
  <circle cx="120" cy="68" r="4" fill="#0d6efd"/>
  <circle cx="148" cy="52" r="4" fill="#0d6efd"/>
  <circle cx="165" cy="38" r="4" fill="#0d6efd"/>
  <!-- Vertical dashes from dots to axis -->
  <line x1="22" y1="79" x2="22" y2="105" stroke="#0d6efd" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.3"/>
  <line x1="68" y1="32" x2="68" y2="105" stroke="#0d6efd" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.3"/>
  <line x1="120" y1="68" x2="120" y2="105" stroke="#0d6efd" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.3"/>
  <line x1="165" y1="38" x2="165" y2="105" stroke="#0d6efd" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.3"/>
  <!-- Axis -->
  <line x1="15" y1="105" x2="180" y2="105" stroke="#adb5bd" stroke-width="1"/>
</svg>
