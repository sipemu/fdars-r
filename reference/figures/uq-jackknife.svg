<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" fill="none" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Title -->
  <text x="350" y="20" text-anchor="middle" font-size="18.8" font-weight="bold" fill="#D55E00">Jackknife+ Regression</text>
  <text x="350" y="37" text-anchor="middle" font-size="12.5" fill="#888">Leave-one-out calibration — most data-efficient conformal method</text>

  <!-- ===== Left: LOO diagram ===== -->
  <rect x="10" y="50" width="330" height="155" rx="6" fill="#FEF0E6" stroke="#D55E00" stroke-width="1.2"/>
  <text x="175" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#D55E00">Leave-One-Out</text>

  <!-- Data strip with one removed -->
  <rect x="30" y="84" width="260" height="16" rx="3" fill="#D55E00" opacity="0.12"/>
  <!-- Individual observations -->
  <circle cx="42" cy="92" r="5" fill="#D55E00" opacity="0.2"/>
  <circle cx="56" cy="92" r="5" fill="#D55E00" opacity="0.2"/>
  <circle cx="70" cy="92" r="5" fill="#D55E00" opacity="0.2"/>
  <circle cx="84" cy="92" r="5" fill="white" stroke="#D55E00" stroke-width="1.2"/>
  <text x="84" y="95" text-anchor="middle" font-size="7" fill="#D55E00">i</text>
  <circle cx="98" cy="92" r="5" fill="#D55E00" opacity="0.2"/>
  <circle cx="112" cy="92" r="5" fill="#D55E00" opacity="0.2"/>
  <circle cx="126" cy="92" r="5" fill="#D55E00" opacity="0.2"/>
  <circle cx="140" cy="92" r="5" fill="#D55E00" opacity="0.2"/>
  <text x="160" y="95" font-size="9" fill="#888">···</text>
  <circle cx="180" cy="92" r="5" fill="#D55E00" opacity="0.2"/>
  <circle cx="194" cy="92" r="5" fill="#D55E00" opacity="0.2"/>

  <!-- Arrow from removed obs -->
  <path d="M84 100 L84 118" stroke="#D55E00" stroke-width="0.8"/>
  <text x="84" y="130" text-anchor="middle" font-size="9" fill="#D55E00">fit on n−1</text>
  <text x="84" y="142" text-anchor="middle" font-size="9" fill="#D55E00">predict obs i</text>

  <!-- Residual formula -->
  <text x="175" y="162" text-anchor="middle" font-size="11" fill="#D55E00">r_i = |y_i − ŷ_i^(−i)|</text>

  <!-- Repeat n times -->
  <rect x="220" y="108" width="100" height="40" rx="4" fill="#D55E00" opacity="0.06" stroke="#D55E00" stroke-width="0.5"/>
  <text x="270" y="124" text-anchor="middle" font-size="10" fill="#D55E00">repeat n times</text>
  <text x="270" y="138" text-anchor="middle" font-size="9" fill="#888">n model fits</text>

  <!-- Arrow to quantile -->
  <text x="175" y="180" text-anchor="middle" font-size="10" fill="#D55E00">r₁, r₂, …, rₙ → quantile q̂</text>
  <text x="175" y="196" text-anchor="middle" font-size="9" fill="#888">ŷ_new ± q̂ → prediction interval</text>

  <!-- ===== Right: Result ===== -->
  <rect x="360" y="50" width="330" height="155" rx="6" fill="#FEF0E6" stroke="#D55E00" stroke-width="1.2"/>
  <text x="525" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#D55E00">Jackknife+ Intervals</text>
  <text x="525" y="85" text-anchor="middle" font-size="11" fill="#888">Adaptive width from leave-one-out residuals</text>

  <!-- Axes -->
  <line x1="374" y1="185" x2="676" y2="185" stroke="#ccc" stroke-width="0.6"/>
  <line x1="374" y1="95" x2="374" y2="185" stroke="#ccc" stroke-width="0.6"/>
  <text x="525" y="198" text-anchor="middle" font-size="9.4" fill="#888">Test Observation</text>

  <!-- JK+ band (slightly variable) -->
  <path d="M382 108 Q430 100 480 106 Q525 112 570 105 Q620 100 668 106
           L668 152 Q620 158 570 152 Q525 157 480 153 Q430 156 382 150 Z"
        fill="#D55E00" opacity="0.12"/>
  <!-- Predicted line -->
  <path d="M382 130Q430 125 480 128Q525 133 570 128Q620 126 668 130"
        stroke="#B84D00" stroke-width="1.8" fill="none"/>

  <!-- Test points -->
  <circle cx="398" cy="133" r="2.2" fill="#2C5F8A" opacity="0.7"/>
  <circle cx="430" cy="126" r="2.2" fill="#2C5F8A" opacity="0.7"/>
  <circle cx="462" cy="129" r="2.2" fill="#2C5F8A" opacity="0.7"/>
  <circle cx="494" cy="135" r="2.2" fill="#2C5F8A" opacity="0.7"/>
  <circle cx="525" cy="131" r="2.2" fill="#2C5F8A" opacity="0.7"/>
  <circle cx="556" cy="126" r="2.2" fill="#2C5F8A" opacity="0.7"/>
  <circle cx="588" cy="130" r="2.2" fill="#2C5F8A" opacity="0.7"/>
  <circle cx="620" cy="124" r="2.2" fill="#2C5F8A" opacity="0.7"/>
  <circle cx="652" cy="132" r="2.2" fill="#2C5F8A" opacity="0.7"/>

  <!-- Key properties -->
  <rect x="396" y="95" width="56" height="14" rx="2" fill="#D55E00" opacity="0.08" stroke="#D55E00" stroke-width="0.4"/>
  <text x="424" y="105" text-anchor="middle" font-size="8" fill="#D55E00">n fits</text>
  <rect x="458" y="95" width="76" height="14" rx="2" fill="#D55E00" opacity="0.08" stroke="#D55E00" stroke-width="0.4"/>
  <text x="496" y="105" text-anchor="middle" font-size="8" fill="#D55E00">most efficient</text>
  <rect x="540" y="95" width="58" height="14" rx="2" fill="#D55E00" opacity="0.08" stroke="#D55E00" stroke-width="0.4"/>
  <text x="569" y="105" text-anchor="middle" font-size="8" fill="#D55E00">≥ 1−2α</text>

  <!-- Legend -->
  <line x1="590" y1="170" x2="602" y2="170" stroke="#B84D00" stroke-width="1.2"/>
  <text x="605" y="173" font-size="8.6" fill="#B84D00">predicted</text>
  <circle cx="642" cy="170" r="1.8" fill="#2C5F8A" opacity="0.7"/>
  <text x="647" y="173" font-size="8.6" fill="#2C5F8A">observed</text>
</svg>
