<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Andrews intro: Fourier basis functions fanning out -->
  <!-- 1/sqrt(2) constant -->
  <path d="M15 60 L190 60" stroke="#666" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- sin(t) -->
  <path d="M15 60 Q50 25, 100 60 Q150 95, 190 60" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- cos(t) -->
  <path d="M15 30 Q50 45, 100 60 Q150 75, 190 90" stroke="#D94A4A" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- sin(2t) -->
  <path d="M15 60 Q35 30, 55 60 Q75 90, 100 60 Q125 30, 145 60 Q165 90, 190 60" stroke="#4AD98A" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <!-- cos(2t) -->
  <path d="M15 30 Q35 50, 55 60 Q75 50, 100 30 Q125 50, 145 60 Q165 50, 190 30" stroke="#D9A54A" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <!-- Arrow from row to curve -->
  <rect x="20" y="100" width="6" height="6" rx="1" fill="#333" opacity="0.6"/>
  <rect x="30" y="100" width="6" height="6" rx="1" fill="#333" opacity="0.6"/>
  <rect x="40" y="100" width="6" height="6" rx="1" fill="#333" opacity="0.6"/>
  <path d="M55 103 L70 103" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#333"/>
    </marker>
  </defs>
</svg>
