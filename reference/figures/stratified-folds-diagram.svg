<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 425" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrowD2" markerWidth="6" markerHeight="8" refX="3" refY="7" orient="auto">
      <path d="M0,0 L3,8 L6,0" fill="#888"/>
    </marker>
    <!-- Gradient for y values -->
    <linearGradient id="yGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2166AC"/>
      <stop offset="50%" stop-color="#F7F7F7"/>
      <stop offset="100%" stop-color="#B2182B"/>
    </linearGradient>
  </defs>

  <!-- ===== LEFT: RANDOM FOLDS ===== -->
  <text x="150" y="25" text-anchor="middle" font-size="16.2" font-weight="bold" fill="#666">Random Folds</text>

  <!-- Y-axis label -->
  <text x="14" y="37.5" font-size="11.2" fill="#888">low y</text>
  <text x="14" y="162.5" font-size="11.2" fill="#888">high y</text>
  <line x1="30" y1="42.5" x2="30" y2="160" stroke="#ccc" stroke-width="0.9"/>
  <path d="M 30 42.5 L 27 50.0 M 30 42.5 L 33 50.0" stroke="#ccc" stroke-width="0.9"/>
  <path d="M 30 160.0 L 27 152.5 M 30 160.0 L 33 152.5" stroke="#ccc" stroke-width="0.9"/>

  <!-- 20 data points, sorted by y, randomly assigned to 4 folds -->
  <!-- Row 1-5: low y (blue) -->
  <circle cx="60" cy="47.5" r="5" fill="#2166AC" opacity="0.8"/><text x="60" y="51.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">1</text>
  <circle cx="80" cy="47.5" r="5" fill="#2166AC" opacity="0.8"/><text x="80" y="51.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">1</text>
  <circle cx="100" cy="47.5" r="5" fill="#2166AC" opacity="0.8"/><text x="100" y="51.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">3</text>
  <circle cx="120" cy="47.5" r="5" fill="#2166AC" opacity="0.8"/><text x="120" y="51.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">3</text>
  <circle cx="140" cy="47.5" r="5" fill="#2166AC" opacity="0.8"/><text x="140" y="51.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">4</text>
  <!-- Row 6-10: low-mid y (light blue) -->
  <circle cx="60" cy="72.5" r="5" fill="#67A9CF" opacity="0.8"/><text x="60" y="76.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">2</text>
  <circle cx="80" cy="72.5" r="5" fill="#67A9CF" opacity="0.8"/><text x="80" y="76.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">2</text>
  <circle cx="100" cy="72.5" r="5" fill="#67A9CF" opacity="0.8"/><text x="100" y="76.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">4</text>
  <circle cx="120" cy="72.5" r="5" fill="#67A9CF" opacity="0.8"/><text x="120" y="76.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">1</text>
  <circle cx="140" cy="72.5" r="5" fill="#67A9CF" opacity="0.8"/><text x="140" y="76.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">3</text>
  <!-- Row 11-15: mid-high y (light red) -->
  <circle cx="60" cy="97.5" r="5" fill="#EF8A62" opacity="0.8"/><text x="60" y="101.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">4</text>
  <circle cx="80" cy="97.5" r="5" fill="#EF8A62" opacity="0.8"/><text x="80" y="101.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">4</text>
  <circle cx="100" cy="97.5" r="5" fill="#EF8A62" opacity="0.8"/><text x="100" y="101.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">2</text>
  <circle cx="120" cy="97.5" r="5" fill="#EF8A62" opacity="0.8"/><text x="120" y="101.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">1</text>
  <circle cx="140" cy="97.5" r="5" fill="#EF8A62" opacity="0.8"/><text x="140" y="101.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">2</text>
  <!-- Row 16-20: high y (red) -->
  <circle cx="60" cy="122.5" r="5" fill="#B2182B" opacity="0.8"/><text x="60" y="126.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">3</text>
  <circle cx="80" cy="122.5" r="5" fill="#B2182B" opacity="0.8"/><text x="80" y="126.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">3</text>
  <circle cx="100" cy="122.5" r="5" fill="#B2182B" opacity="0.8"/><text x="100" y="126.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">4</text>
  <circle cx="120" cy="122.5" r="5" fill="#B2182B" opacity="0.8"/><text x="120" y="126.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">1</text>
  <circle cx="140" cy="122.5" r="5" fill="#B2182B" opacity="0.8"/><text x="140" y="126.2" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">2</text>

  <!-- Arrows down -->
  <line x1="100" y1="140" x2="100" y2="165" stroke="#888" stroke-width="1.1" marker-end="u r l a r r o w D 2"/>

  <!-- Resulting random folds: unbalanced stacked bars -->
  <text x="150" y="185" text-anchor="middle" font-size="12.5" fill="#888">Resulting fold distributions</text>

  <!-- Fold 1: 2 blue, 1 lightblue, 1 lightred, 1 red = skewed low -->
  <text x="52" y="210" text-anchor="middle" font-size="10" fill="#555">Fold 1</text>
  <rect x="40" y="215" width="24" height="12.5" fill="#2166AC" opacity="0.8"/>
  <rect x="40" y="227.5" width="24" height="12.5" fill="#2166AC" opacity="0.8"/>
  <rect x="40" y="240" width="24" height="6.2" fill="#67A9CF" opacity="0.8"/>
  <rect x="40" y="246.2" width="24" height="6.2" fill="#EF8A62" opacity="0.8"/>
  <rect x="40" y="252.5" width="24" height="6.2" fill="#B2182B" opacity="0.8"/>

  <!-- Fold 2: 0 blue, 2 lightblue, 2 lightred, 1 red = skewed high -->
  <text x="92" y="210" text-anchor="middle" font-size="10" fill="#555">Fold 2</text>
  <rect x="80" y="227.5" width="24" height="12.5" fill="#67A9CF" opacity="0.8"/>
  <rect x="80" y="240" width="24" height="6.2" fill="#EF8A62" opacity="0.8"/>
  <rect x="80" y="246.2" width="24" height="6.2" fill="#EF8A62" opacity="0.8"/>
  <rect x="80" y="252.5" width="24" height="6.2" fill="#B2182B" opacity="0.8"/>

  <!-- Fold 3: 2 blue, 1 lightblue, 0 lightred, 2 red = bimodal -->
  <text x="132" y="210" text-anchor="middle" font-size="10" fill="#555">Fold 3</text>
  <rect x="120" y="215" width="24" height="12.5" fill="#2166AC" opacity="0.8"/>
  <rect x="120" y="227.5" width="24" height="12.5" fill="#2166AC" opacity="0.8"/>
  <rect x="120" y="240" width="24" height="6.2" fill="#67A9CF" opacity="0.8"/>
  <rect x="120" y="246.2" width="24" height="12.5" fill="#B2182B" opacity="0.8"/>

  <!-- Fold 4: 1 blue, 1 lightblue, 2 lightred, 1 red = skewed high -->
  <text x="172" y="210" text-anchor="middle" font-size="10" fill="#555">Fold 4</text>
  <rect x="160" y="221.2" width="24" height="6.2" fill="#2166AC" opacity="0.8"/>
  <rect x="160" y="227.5" width="24" height="6.2" fill="#67A9CF" opacity="0.8"/>
  <rect x="160" y="233.8" width="24" height="12.5" fill="#EF8A62" opacity="0.8"/>
  <rect x="160" y="246.2" width="24" height="12.5" fill="#B2182B" opacity="0.8"/>

  <!-- Warning icon -->
  <text x="150" y="282.5" text-anchor="middle" font-size="11.2" fill="#D55E00" font-weight="bold">Uneven y distributions per fold</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="300" y1="17.5" x2="300" y2="287.5" stroke="#ddd" stroke-width="1.6" stroke-dasharray="6,4"/>

  <!-- ===== RIGHT: STRATIFIED FOLDS ===== -->
  <text x="450" y="25" text-anchor="middle" font-size="16.2" font-weight="bold" fill="#2C5F8A">Stratified Folds</text>

  <!-- Step 1: Bin by quantile -->
  <text x="450" y="45" text-anchor="middle" font-size="11.2" fill="#888">Step 1: Bin y into quantile groups</text>

  <!-- Quantile bins with brackets -->
  <!-- Bin 1 (low, blue) -->
  <rect x="320" y="55" width="260" height="22.5" rx="2" fill="#2166AC" opacity="0.08" stroke="#2166AC" stroke-width="0.9"/>
  <text x="326" y="70" font-size="10" fill="#2166AC" font-weight="bold">Q1</text>
  <circle cx="360" cy="66.2" r="5" fill="#2166AC" opacity="0.8"/>
  <circle cx="380" cy="66.2" r="5" fill="#2166AC" opacity="0.8"/>
  <circle cx="400" cy="66.2" r="5" fill="#2166AC" opacity="0.8"/>
  <circle cx="420" cy="66.2" r="5" fill="#2166AC" opacity="0.8"/>
  <circle cx="440" cy="66.2" r="5" fill="#2166AC" opacity="0.8"/>

  <!-- Bin 2 (light blue) -->
  <rect x="320" y="82.5" width="260" height="22.5" rx="2" fill="#67A9CF" opacity="0.08" stroke="#67A9CF" stroke-width="0.9"/>
  <text x="326" y="97.5" font-size="10" fill="#67A9CF" font-weight="bold">Q2</text>
  <circle cx="360" cy="93.8" r="5" fill="#67A9CF" opacity="0.8"/>
  <circle cx="380" cy="93.8" r="5" fill="#67A9CF" opacity="0.8"/>
  <circle cx="400" cy="93.8" r="5" fill="#67A9CF" opacity="0.8"/>
  <circle cx="420" cy="93.8" r="5" fill="#67A9CF" opacity="0.8"/>
  <circle cx="440" cy="93.8" r="5" fill="#67A9CF" opacity="0.8"/>

  <!-- Bin 3 (light red) -->
  <rect x="320" y="110" width="260" height="22.5" rx="2" fill="#EF8A62" opacity="0.08" stroke="#EF8A62" stroke-width="0.9"/>
  <text x="326" y="125" font-size="10" fill="#EF8A62" font-weight="bold">Q3</text>
  <circle cx="360" cy="121.2" r="5" fill="#EF8A62" opacity="0.8"/>
  <circle cx="380" cy="121.2" r="5" fill="#EF8A62" opacity="0.8"/>
  <circle cx="400" cy="121.2" r="5" fill="#EF8A62" opacity="0.8"/>
  <circle cx="420" cy="121.2" r="5" fill="#EF8A62" opacity="0.8"/>
  <circle cx="440" cy="121.2" r="5" fill="#EF8A62" opacity="0.8"/>

  <!-- Bin 4 (red) -->
  <rect x="320" y="137.5" width="260" height="22.5" rx="2" fill="#B2182B" opacity="0.08" stroke="#B2182B" stroke-width="0.9"/>
  <text x="326" y="152.5" font-size="10" fill="#B2182B" font-weight="bold">Q4</text>
  <circle cx="360" cy="148.8" r="5" fill="#B2182B" opacity="0.8"/>
  <circle cx="380" cy="148.8" r="5" fill="#B2182B" opacity="0.8"/>
  <circle cx="400" cy="148.8" r="5" fill="#B2182B" opacity="0.8"/>
  <circle cx="420" cy="148.8" r="5" fill="#B2182B" opacity="0.8"/>
  <circle cx="440" cy="148.8" r="5" fill="#B2182B" opacity="0.8"/>

  <!-- Step 2 label -->
  <text x="450" y="177.5" text-anchor="middle" font-size="11.2" fill="#888">Step 2: Sample within each bin to folds</text>

  <!-- Arrows: from bins to fold assignments -->
  <!-- Thin lines from each bin distributing 1 per fold -->
  <line x1="360" y1="66.2" x2="352" y2="200" stroke="#2166AC" stroke-width="0.5" opacity="0.4"/>
  <line x1="380" y1="66.2" x2="392" y2="200" stroke="#2166AC" stroke-width="0.5" opacity="0.4"/>
  <line x1="400" y1="66.2" x2="432" y2="200" stroke="#2166AC" stroke-width="0.5" opacity="0.4"/>
  <line x1="420" y1="66.2" x2="472" y2="200" stroke="#2166AC" stroke-width="0.5" opacity="0.4"/>
  <line x1="440" y1="66.2" x2="512" y2="200" stroke="#2166AC" stroke-width="0.5" opacity="0.4"/>

  <line x1="360" y1="93.8" x2="352" y2="200" stroke="#67A9CF" stroke-width="0.5" opacity="0.4"/>
  <line x1="380" y1="93.8" x2="392" y2="200" stroke="#67A9CF" stroke-width="0.5" opacity="0.4"/>
  <line x1="400" y1="93.8" x2="432" y2="200" stroke="#67A9CF" stroke-width="0.5" opacity="0.4"/>
  <line x1="420" y1="93.8" x2="472" y2="200" stroke="#67A9CF" stroke-width="0.5" opacity="0.4"/>
  <line x1="440" y1="93.8" x2="512" y2="200" stroke="#67A9CF" stroke-width="0.5" opacity="0.4"/>

  <line x1="360" y1="121.2" x2="352" y2="200" stroke="#EF8A62" stroke-width="0.5" opacity="0.4"/>
  <line x1="380" y1="121.2" x2="392" y2="200" stroke="#EF8A62" stroke-width="0.5" opacity="0.4"/>
  <line x1="400" y1="121.2" x2="432" y2="200" stroke="#EF8A62" stroke-width="0.5" opacity="0.4"/>
  <line x1="420" y1="121.2" x2="472" y2="200" stroke="#EF8A62" stroke-width="0.5" opacity="0.4"/>
  <line x1="440" y1="121.2" x2="512" y2="200" stroke="#EF8A62" stroke-width="0.5" opacity="0.4"/>

  <line x1="360" y1="148.8" x2="352" y2="200" stroke="#B2182B" stroke-width="0.5" opacity="0.4"/>
  <line x1="380" y1="148.8" x2="392" y2="200" stroke="#B2182B" stroke-width="0.5" opacity="0.4"/>
  <line x1="400" y1="148.8" x2="432" y2="200" stroke="#B2182B" stroke-width="0.5" opacity="0.4"/>
  <line x1="420" y1="148.8" x2="472" y2="200" stroke="#B2182B" stroke-width="0.5" opacity="0.4"/>
  <line x1="440" y1="148.8" x2="512" y2="200" stroke="#B2182B" stroke-width="0.5" opacity="0.4"/>

  <!-- Resulting stratified folds: balanced stacked bars -->
  <text x="450" y="215" text-anchor="middle" font-size="12.5" fill="#2C5F8A">Each fold has the same y distribution</text>

  <!-- Fold 1: 1 of each color -->
  <text x="352" y="235" text-anchor="middle" font-size="10" fill="#555">Fold 1</text>
  <rect x="340" y="240" width="24" height="10" fill="#2166AC" opacity="0.8"/>
  <rect x="340" y="250" width="24" height="10" fill="#67A9CF" opacity="0.8"/>
  <rect x="340" y="260" width="24" height="10" fill="#EF8A62" opacity="0.8"/>
  <rect x="340" y="270" width="24" height="10" fill="#B2182B" opacity="0.8"/>

  <!-- Fold 2 -->
  <text x="392" y="235" text-anchor="middle" font-size="10" fill="#555">Fold 2</text>
  <rect x="380" y="240" width="24" height="10" fill="#2166AC" opacity="0.8"/>
  <rect x="380" y="250" width="24" height="10" fill="#67A9CF" opacity="0.8"/>
  <rect x="380" y="260" width="24" height="10" fill="#EF8A62" opacity="0.8"/>
  <rect x="380" y="270" width="24" height="10" fill="#B2182B" opacity="0.8"/>

  <!-- Fold 3 -->
  <text x="432" y="235" text-anchor="middle" font-size="10" fill="#555">Fold 3</text>
  <rect x="420" y="240" width="24" height="10" fill="#2166AC" opacity="0.8"/>
  <rect x="420" y="250" width="24" height="10" fill="#67A9CF" opacity="0.8"/>
  <rect x="420" y="260" width="24" height="10" fill="#EF8A62" opacity="0.8"/>
  <rect x="420" y="270" width="24" height="10" fill="#B2182B" opacity="0.8"/>

  <!-- Fold 4 -->
  <text x="472" y="235" text-anchor="middle" font-size="10" fill="#555">Fold 4</text>
  <rect x="460" y="240" width="24" height="10" fill="#2166AC" opacity="0.8"/>
  <rect x="460" y="250" width="24" height="10" fill="#67A9CF" opacity="0.8"/>
  <rect x="460" y="260" width="24" height="10" fill="#EF8A62" opacity="0.8"/>
  <rect x="460" y="270" width="24" height="10" fill="#B2182B" opacity="0.8"/>

  <!-- Fold 5 -->
  <text x="512" y="235" text-anchor="middle" font-size="10" fill="#555">Fold 5</text>
  <rect x="500" y="240" width="24" height="10" fill="#2166AC" opacity="0.8"/>
  <rect x="500" y="250" width="24" height="10" fill="#67A9CF" opacity="0.8"/>
  <rect x="500" y="260" width="24" height="10" fill="#EF8A62" opacity="0.8"/>
  <rect x="500" y="270" width="24" height="10" fill="#B2182B" opacity="0.8"/>

  <!-- Check mark -->
  <text x="450" y="300" text-anchor="middle" font-size="11.2" fill="#2E8B57" font-weight="bold">Balanced y distributions per fold</text>

  <!-- ===== BOTTOM: Legend ===== -->
  <line x1="10" y1="325" x2="590" y2="325" stroke="#eee" stroke-width="1.1"/>
  <text x="300" y="350" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#555">Response value (y)</text>
  <rect x="100" y="362.5" width="400" height="17.5" rx="4" fill="url(#yGrad)" opacity="0.7"/>
  <text x="100" y="397.5" font-size="11.2" fill="#2166AC">low</text>
  <text x="290" y="397.5" text-anchor="middle" font-size="11.2" fill="#888">median</text>
  <text x="500" y="397.5" text-anchor="end" font-size="11.2" fill="#B2182B">high</text>

  <!-- Explanation -->
  <text x="300" y="422.5" text-anchor="middle" font-size="11.2" fill="#888">Numbers in circles = fold assignment. Stratification bins y into quantile groups, then samples within each bin.</text>
</svg>
