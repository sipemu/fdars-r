<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arrowD" markerWidth="6" markerHeight="8" refX="3" refY="7" orient="auto">
      <path d="M0,0 L3,8 L6,0" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Nested Cross-Validation</text>

  <!-- ===== OUTER FOLD 1 ===== -->
  <!-- test = fold 1, train = folds 2-5 -->
  <rect x="10" y="36" width="580" height="90" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="24" y="54" font-size="11" font-weight="bold" fill="#2C5F8A">Outer fold 1</text>

  <!-- Data blocks -->
  <rect x="24" y="62" width="90" height="18" rx="3" fill="#D55E00" opacity="0.25" stroke="#D55E00" stroke-width="1"/>
  <text x="69" y="75" text-anchor="middle" font-size="9" fill="#D55E00" font-weight="bold">Fold 1 (test)</text>
  <rect x="120" y="62" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="165" y="75" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 2</text>
  <rect x="216" y="62" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="261" y="75" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 3</text>
  <rect x="312" y="62" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="357" y="75" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 4</text>
  <rect x="408" y="62" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="453" y="75" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 5</text>

  <!-- Inner CV: spans folds 2-5 only (x=120 to x=498) -->
  <rect x="120" y="86" width="378" height="32" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="309" y="100" text-anchor="middle" font-size="9" fill="#B37700" font-weight="bold">Inner CV on folds 2, 3, 4, 5</text>
  <text x="309" y="112" text-anchor="middle" font-size="9" fill="#B37700">select ncomp = 4</text>

  <!-- Arrow + OOF -->
  <line x1="498" y1="102" x2="530" y2="102" stroke="#555" stroke-width="1" marker-end="url(#arrowR)"/>
  <rect x="534" y="90" width="48" height="24" rx="3" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1"/>
  <text x="558" y="106" text-anchor="middle" font-size="8" fill="#2E8B57" font-weight="bold">OOF 1</text>

  <!-- ===== OUTER FOLD 2 ===== -->
  <!-- test = fold 2, train = folds 1, 3, 4, 5 -->
  <rect x="10" y="134" width="580" height="90" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="24" y="152" font-size="11" font-weight="bold" fill="#2C5F8A">Outer fold 2</text>

  <!-- Data blocks -->
  <rect x="24" y="160" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="69" y="173" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 1</text>
  <rect x="120" y="160" width="90" height="18" rx="3" fill="#D55E00" opacity="0.25" stroke="#D55E00" stroke-width="1"/>
  <text x="165" y="173" text-anchor="middle" font-size="9" fill="#D55E00" font-weight="bold">Fold 2 (test)</text>
  <rect x="216" y="160" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="261" y="173" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 3</text>
  <rect x="312" y="160" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="357" y="173" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 4</text>
  <rect x="408" y="160" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="453" y="173" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 5</text>

  <!-- Inner CV: two boxes — fold 1 (x=24..114) and folds 3-5 (x=216..498), skipping test fold 2 -->
  <rect x="24" y="186" width="90" height="30" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="216" y="186" width="282" height="30" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2" stroke-dasharray="4,2"/>
  <!-- Dashed connector between the two yellow boxes -->
  <line x1="114" y1="201" x2="216" y2="201" stroke="#E6A020" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="309" y="200" text-anchor="middle" font-size="9" fill="#B37700" font-weight="bold">Inner CV on folds 1, 3, 4, 5</text>
  <text x="309" y="210" text-anchor="middle" font-size="9" fill="#B37700">select ncomp = 3</text>

  <!-- Arrow + OOF -->
  <line x1="498" y1="201" x2="530" y2="201" stroke="#555" stroke-width="1" marker-end="url(#arrowR)"/>
  <rect x="534" y="189" width="48" height="24" rx="3" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1"/>
  <text x="558" y="205" text-anchor="middle" font-size="8" fill="#2E8B57" font-weight="bold">OOF 2</text>

  <!-- ===== ELLIPSIS ===== -->
  <text x="300" y="244" text-anchor="middle" font-size="16" fill="#999" letter-spacing="6">. . .</text>

  <!-- ===== OUTER FOLD 5 ===== -->
  <!-- test = fold 5, train = folds 1-4 -->
  <rect x="10" y="258" width="580" height="90" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="24" y="276" font-size="11" font-weight="bold" fill="#2C5F8A">Outer fold 5</text>

  <!-- Data blocks -->
  <rect x="24" y="282" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="69" y="295" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 1</text>
  <rect x="120" y="282" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="165" y="295" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 2</text>
  <rect x="216" y="282" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="261" y="295" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 3</text>
  <rect x="312" y="282" width="90" height="18" rx="3" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="357" y="295" text-anchor="middle" font-size="9" fill="#4A90D9">Fold 4</text>
  <rect x="408" y="282" width="90" height="18" rx="3" fill="#D55E00" opacity="0.25" stroke="#D55E00" stroke-width="1"/>
  <text x="453" y="295" text-anchor="middle" font-size="9" fill="#D55E00" font-weight="bold">Fold 5 (test)</text>

  <!-- Inner CV: spans folds 1-4 only (x=24 to x=402) -->
  <rect x="24" y="306" width="378" height="30" rx="4" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="213" y="320" text-anchor="middle" font-size="9" fill="#B37700" font-weight="bold">Inner CV on folds 1, 2, 3, 4</text>
  <text x="213" y="330" text-anchor="middle" font-size="9" fill="#B37700">select ncomp = 5</text>

  <!-- Arrow + OOF -->
  <line x1="402" y1="321" x2="530" y2="321" stroke="#555" stroke-width="1" marker-end="url(#arrowR)"/>
  <rect x="534" y="309" width="48" height="24" rx="3" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1"/>
  <text x="558" y="325" text-anchor="middle" font-size="8" fill="#2E8B57" font-weight="bold">OOF 5</text>

  <!-- ===== Vertical connector: OOF stack ===== -->
  <line x1="558" y1="114" x2="558" y2="134" stroke="#2E8B57" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="558" y1="213" x2="558" y2="232" stroke="#2E8B57" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="558" y1="248" x2="558" y2="258" stroke="#2E8B57" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="558" y1="333" x2="558" y2="348" stroke="#2E8B57" stroke-width="1" marker-end="url(#arrowD)"/>

  <!-- Final result -->
  <rect x="480" y="350" width="116" height="20" rx="4" fill="#2E8B57" opacity="0.2" stroke="#2E8B57" stroke-width="1.2"/>
  <text x="538" y="364" text-anchor="middle" font-size="9" fill="#2E8B57" font-weight="bold">All OOF predictions</text>

  <!-- Legend -->
  <rect x="14" y="352" width="12" height="12" rx="2" fill="#4A90D9" opacity="0.2" stroke="#4A90D9" stroke-width="0.8"/>
  <text x="30" y="362" font-size="9" fill="#555">Train</text>
  <rect x="70" y="352" width="12" height="12" rx="2" fill="#D55E00" opacity="0.25" stroke="#D55E00" stroke-width="1"/>
  <text x="86" y="362" font-size="9" fill="#555">Test</text>
  <rect x="120" y="352" width="12" height="12" rx="2" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2" stroke-dasharray="2,1"/>
  <text x="136" y="362" font-size="9" fill="#555">Inner CV (hyperparameter tuning)</text>
  <rect x="320" y="352" width="12" height="12" rx="2" fill="#2E8B57" opacity="0.15" stroke="#2E8B57" stroke-width="1"/>
  <text x="336" y="362" font-size="9" fill="#555">Out-of-fold prediction</text>
</svg>
