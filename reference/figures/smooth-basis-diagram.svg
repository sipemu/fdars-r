<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrSB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="27.5" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Penalized Basis Smoothing</text>
  <text x="300" y="50" text-anchor="middle" font-size="12.5" fill="#888">min &#x2016;y &#8722; &#934;c&#x2016;&#xB2; + &#955; c&#x1D40; P c    (roughness penalty)</text>

  <!-- ===== LEFT: Noisy data + basis functions ===== -->
  <rect x="14" y="67.5" width="170" height="162.5" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.3"/>
  <text x="99" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C5F8A">Noisy Observations</text>

  <!-- Scatter points -->
  <circle cx="28" cy="150" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="38" cy="135" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="48" cy="160" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="58" cy="125" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="68" cy="143.8" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="78" cy="165" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="88" cy="120" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="98" cy="147.5" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="108" cy="131.2" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="118" cy="162.5" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="128" cy="140" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="138" cy="122.5" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="148" cy="155" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="158" cy="132.5" r="2.5" fill="#999" opacity="0.5"/>
  <circle cx="168" cy="145" r="2.5" fill="#999" opacity="0.5"/>

  <!-- Basis functions underneath (light) -->
  <path d="M 24 193.8 Q 50 175.0 76 193.8 Q 102 212.5 128 193.8 Q 154 175.0 170 193.8" stroke="#4A90D9" stroke-width="1.1" fill="none" opacity="0.25"/>
  <path d="M 24 197.5 Q 44 181.2 64 197.5 Q 84 213.8 104 197.5 Q 124 181.2 144 197.5 Q 164 213.8 170 202.5" stroke="#E6A020" stroke-width="1.1" fill="none" opacity="0.25"/>
  <path d="M 24 200.0 Q 38 185.0 52 200.0 Q 66 215.0 80 200.0 Q 94 185.0 108 200.0 Q 122 215.0 136 200.0 Q 150 185.0 170 197.5" stroke="#7B2D8E" stroke-width="1.1" fill="none" opacity="0.25"/>
  <text x="99" y="222.5" text-anchor="middle" font-size="10" fill="#888">B-spline / Fourier basis</text>

  <!-- Arrow to middle -->
  <line x1="190" y1="140" x2="214" y2="140" stroke="#555" stroke-width="1.3" marker-end="u r l a r r S B"/>
  <text x="202" y="127.5" text-anchor="middle" font-size="8.8" fill="#888">fit</text>
  <text x="202" y="157.5" text-anchor="middle" font-size="8.8" fill="#888">+ penalty</text>

  <!-- ===== CENTER: Penalty control ===== -->
  <rect x="220" y="67.5" width="150" height="162.5" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3"/>
  <text x="295" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B37700">Penalty &#955;P</text>
  <text x="295" y="107.5" text-anchor="middle" font-size="10" fill="#888">roughness control</text>

  <!-- Three smoothing levels -->
  <!-- Undersmoothed (wiggly) -->
  <path d="M 234 135.0 Q 244 122.5 254 140.0 Q 264 157.5 274 125.0 Q 284 92.5 294 132.5 Q 304 172.5 314 130.0 Q 324 87.5 334 135.0 Q 344 182.5 354 140.0" stroke="#D55E00" stroke-width="1.3" fill="none" opacity="0.5"/>
  <text x="360" y="140" font-size="8.8" fill="#D55E00">&#955;&#x2248;0</text>

  <!-- Optimal (good fit) -->
  <path d="M 234 165.0 Q 254 140.0 274 150.0 Q 294 160.0 314 145.0 Q 334 130.0 354 147.5" stroke="#2E8B57" stroke-width="2.1" fill="none"/>
  <text x="360" y="156.2" font-size="8.8" fill="#2E8B57" font-weight="bold">&#955;*</text>

  <!-- Oversmoothed (flat) -->
  <path d="M 234 185.0 Q 274 180.0 314 182.5 Q 344 185.0 354 182.5" stroke="#7B2D8E" stroke-width="1.3" fill="none" opacity="0.5"/>
  <text x="360" y="187.5" font-size="8.8" fill="#7B2D8E">&#955;&#x2192;&#x221E;</text>

  <text x="295" y="222.5" text-anchor="middle" font-size="10" fill="#888">GCV selects optimal &#955;*</text>

  <!-- Arrow to right -->
  <line x1="376" y1="140" x2="400" y2="140" stroke="#555" stroke-width="1.3" marker-end="u r l a r r S B"/>

  <!-- ===== RIGHT: Smooth result ===== -->
  <rect x="406" y="67.5" width="180" height="162.5" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="496" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E8B57">Smoothed Curves</text>
  <text x="496" y="107.5" text-anchor="middle" font-size="10" fill="#888">noise removed</text>

  <!-- Scatter (faded) -->
  <circle cx="420" cy="150" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="432" cy="135" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="444" cy="160" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="456" cy="125" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="468" cy="143.8" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="480" cy="165" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="492" cy="120" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="504" cy="147.5" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="516" cy="131.2" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="528" cy="162.5" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="540" cy="140" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="552" cy="122.5" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="564" cy="155" r="1.5" fill="#999" opacity="0.2"/>
  <circle cx="576" cy="132.5" r="1.5" fill="#999" opacity="0.2"/>

  <!-- Clean smooth curve -->
  <path d="M 420 147.5 Q 440 127.5 460 137.5 Q 480 147.5 500 135.0 Q 520 122.5 540 137.5 Q 560 152.5 580 140.0" stroke="#2E8B57" stroke-width="2.7" fill="none"/>

  <!-- Coefficients + diagnostics -->
  <rect x="418" y="175" width="70" height="40" rx="4" fill="#2E8B57" opacity="0.1"/>
  <text x="453" y="192.5" text-anchor="middle" font-size="10" fill="#2E8B57" font-weight="bold">Coefficients</text>
  <text x="453" y="207.5" text-anchor="middle" font-size="8.8" fill="#888">c&#8321;, c&#8322;, &#8230;</text>

  <rect x="498" y="175" width="76" height="40" rx="4" fill="#E6A020" opacity="0.1"/>
  <text x="536" y="192.5" text-anchor="middle" font-size="10" fill="#B37700" font-weight="bold">Diagnostics</text>
  <text x="536" y="207.5" text-anchor="middle" font-size="8.8" fill="#888">GCV, AIC, EDF</text>

  <!-- ===== BOTTOM: Basis comparison ===== -->
  <line x1="10" y1="247.5" x2="590" y2="247.5" stroke="#eee" stroke-width="1.1"/>

  <text x="300" y="272.5" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#555">Basis Types</text>

  <!-- B-spline box -->
  <rect x="40" y="287.5" width="240" height="90" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="160" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C5F8A">B-spline Basis</text>
  <!-- B-spline bumps -->
  <path d="M 60 350.0 Q 72 322.5 84 350.0" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.5"/>
  <path d="M 80 350.0 Q 92 322.5 104 350.0" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.5"/>
  <path d="M 100 350.0 Q 112 322.5 124 350.0" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.5"/>
  <path d="M 120 350.0 Q 132 322.5 144 350.0" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.5"/>
  <path d="M 140 350.0 Q 152 322.5 164 350.0" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.5"/>
  <text x="200" y="337.5" font-size="10" fill="#555">Local support</text>
  <text x="200" y="352.5" font-size="10" fill="#555">Flexible for non-periodic</text>
  <text x="200" y="367.5" font-size="10" fill="#888">Penalty: D&#xB2; curvature</text>

  <!-- Fourier box -->
  <rect x="320" y="287.5" width="240" height="90" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.1"/>
  <text x="440" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7B2D8E">Fourier Basis</text>
  <!-- Fourier waves -->
  <path d="M 340 345.0 Q 360 322.5 380 345.0 Q 400 367.5 420 345.0" stroke="#7B2D8E" stroke-width="1.6" fill="none" opacity="0.5"/>
  <path d="M 340 345.0 Q 370 320.0 400 345.0 Q 430 370.0 460 345.0" stroke="#7B2D8E" stroke-width="1.1" fill="none" opacity="0.3"/>
  <text x="484" y="337.5" font-size="10" fill="#555">Global support</text>
  <text x="484" y="352.5" font-size="10" fill="#555">Best for periodic data</text>
  <text x="484" y="367.5" font-size="10" fill="#888">Period = domain range</text>
</svg>
