<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrLR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="27.5" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#333">Landmark Registration</text>
  <text x="300" y="50" text-anchor="middle" font-size="12.5" fill="#888">Align curves by matching identified features to common target positions</text>

  <!-- ===== STEP 1: Misaligned curves with landmarks ===== -->
  <rect x="14" y="67.5" width="170" height="162.5" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.3"/>
  <text x="99" y="87.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C5F8A">1. Detect Landmarks</text>

  <!-- Curve A (peak early) -->
  <path d="M 28 190.0 Q 44 185.0 56 150.0 Q 64 115.0 72 100.0 Q 80 115.0 88 150.0 Q 100 185.0 120 192.5 Q 140 187.5 160 185.0 Q 172 182.5 176 185.0" stroke="#4A90D9" stroke-width="1.6" fill="none"/>
  <!-- Peak marker A -->
  <circle cx="72" cy="97.5" r="4" fill="none" stroke="#D55E00" stroke-width="1.9"/>
  <line x1="72" y1="90" x2="72" y2="77.5" stroke="#D55E00" stroke-width="1.1" stroke-dasharray="2,2"/>
  <text x="72" y="72.5" text-anchor="middle" font-size="8.8" fill="#D55E00" font-weight="bold">L&#8321;</text>

  <!-- Curve B (peak later) -->
  <path d="M 28 197.5 Q 50 195.0 68 190.0 Q 88 185.0 100 157.5 Q 108 122.5 116 107.5 Q 124 122.5 132 157.5 Q 144 190.0 160 197.5 Q 172 195.0 176 192.5" stroke="#7B2D8E" stroke-width="1.6" fill="none" opacity="0.7"/>
  <!-- Peak marker B -->
  <circle cx="116" cy="105" r="4" fill="none" stroke="#D55E00" stroke-width="1.9"/>
  <line x1="116" y1="97.5" x2="116" y2="77.5" stroke="#D55E00" stroke-width="1.1" stroke-dasharray="2,2"/>
  <text x="116" y="72.5" text-anchor="middle" font-size="8.8" fill="#D55E00" font-weight="bold">L&#8322;</text>

  <!-- Time axis labels -->
  <text x="72" y="217.5" text-anchor="middle" font-size="8.8" fill="#888">t&#8321;</text>
  <text x="116" y="217.5" text-anchor="middle" font-size="8.8" fill="#888">t&#8322;</text>

  <!-- Arrow -->
  <line x1="190" y1="148.8" x2="214" y2="148.8" stroke="#555" stroke-width="1.3" marker-end="u r l a r r L R"/>

  <!-- ===== STEP 2: Piecewise-linear warping ===== -->
  <rect x="220" y="67.5" width="160" height="162.5" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.3"/>
  <text x="300" y="87.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B37700">2. Compute Warp</text>

  <!-- Warping function plot -->
  <!-- Axes -->
  <line x1="240" y1="212.5" x2="240" y2="105" stroke="#ccc" stroke-width="0.9"/>
  <line x1="240" y1="212.5" x2="364" y2="212.5" stroke="#ccc" stroke-width="0.9"/>
  <text x="236" y="102.5" text-anchor="end" font-size="7.5" fill="#888">&#947;</text>
  <text x="366" y="217.5" font-size="7.5" fill="#888">t</text>

  <!-- Identity (dashed) -->
  <line x1="240" y1="212.5" x2="364" y2="105" stroke="#ccc" stroke-width="0.9" stroke-dasharray="3,2"/>

  <!-- Warp A: peak was early, needs to slow down at start -->
  <path d="M 240 212.5 L 282 162.5 L 340 132.5 L 364 105.0" stroke="#4A90D9" stroke-width="1.6" fill="none"/>
  <circle cx="282" cy="162.5" r="3" fill="#D55E00"/>

  <!-- Warp B: peak was late, needs to speed up at start -->
  <path d="M 240 212.5 L 270 177.5 L 324 125.0 L 364 105.0" stroke="#7B2D8E" stroke-width="1.6" fill="none" opacity="0.7"/>
  <circle cx="324" cy="125" r="3" fill="#D55E00"/>

  <!-- Target annotation -->
  <line x1="302" y1="212.5" x2="302" y2="105" stroke="#D55E00" stroke-width="0.9" stroke-dasharray="2,2" opacity="0.5"/>
  <text x="302" y="100" text-anchor="middle" font-size="8.8" fill="#D55E00">t*</text>

  <text x="300" y="200" text-anchor="middle" font-size="10" fill="#888">piecewise-linear</text>

  <!-- Arrow -->
  <line x1="386" y1="148.8" x2="410" y2="148.8" stroke="#555" stroke-width="1.3" marker-end="u r l a r r L R"/>

  <!-- ===== STEP 3: Aligned curves ===== -->
  <rect x="416" y="67.5" width="170" height="162.5" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.3"/>
  <text x="501" y="87.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E8B57">3. Aligned Result</text>

  <!-- Both curves now peak at same time -->
  <path d="M 430 190.0 Q 454 185.0 470 157.5 Q 480 122.5 488 107.5 Q 496 122.5 506 157.5 Q 518 185.0 538 192.5 Q 558 187.5 572 185.0 Q 580 182.5 580 185.0" stroke="#4A90D9" stroke-width="1.6" fill="none"/>
  <path d="M 430 195.0 Q 452 190.0 468 162.5 Q 478 127.5 488 112.5 Q 498 127.5 508 162.5 Q 520 190.0 540 197.5 Q 558 192.5 572 190.0 Q 580 187.5 580 190.0" stroke="#7B2D8E" stroke-width="1.6" fill="none" opacity="0.7"/>

  <!-- Aligned peak marker -->
  <circle cx="488" cy="105" r="4" fill="none" stroke="#2E8B57" stroke-width="1.9"/>
  <line x1="488" y1="97.5" x2="488" y2="77.5" stroke="#2E8B57" stroke-width="1.1" stroke-dasharray="2,2"/>
  <text x="488" y="72.5" text-anchor="middle" font-size="8.8" fill="#2E8B57" font-weight="bold">t*</text>

  <text x="501" y="217.5" text-anchor="middle" font-size="10" fill="#2E8B57">peaks aligned</text>

  <!-- ===== BOTTOM: Comparison ===== -->
  <line x1="10" y1="247.5" x2="590" y2="247.5" stroke="#eee" stroke-width="1.1"/>

  <rect x="30" y="262.5" width="250" height="62.5" rx="5" fill="#FFF3E0" opacity="0.3" stroke="#E6A020" stroke-width="1.1"/>
  <text x="155" y="285" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#B37700">Landmark Registration</text>
  <text x="155" y="302.5" text-anchor="middle" font-size="10" fill="#555">Feature-driven, interpretable, piecewise-linear</text>
  <text x="155" y="317.5" text-anchor="middle" font-size="10" fill="#555">Needs identifiable landmarks</text>

  <rect x="320" y="262.5" width="250" height="62.5" rx="5" fill="#E8F0FE" opacity="0.3" stroke="#4A90D9" stroke-width="1.1"/>
  <text x="445" y="285" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#2C5F8A">Elastic Alignment</text>
  <text x="445" y="302.5" text-anchor="middle" font-size="10" fill="#555">Global optimization, smooth warps, automatic</text>
  <text x="445" y="317.5" text-anchor="middle" font-size="10" fill="#555">No feature detection required</text>

  <!-- Legend -->
  <line x1="10" y1="342.5" x2="590" y2="342.5" stroke="#eee" stroke-width="1.1"/>
  <line x1="30" y1="362.5" x2="50" y2="362.5" stroke="#4A90D9" stroke-width="2.1"/>
  <text x="56" y="367.5" font-size="11.2" fill="#555">Curve A</text>
  <line x1="110" y1="362.5" x2="130" y2="362.5" stroke="#7B2D8E" stroke-width="2.1" opacity="0.7"/>
  <text x="136" y="367.5" font-size="11.2" fill="#555">Curve B</text>
  <circle cx="200" cy="362.5" r="3.5" fill="none" stroke="#D55E00" stroke-width="1.6"/>
  <text x="210" y="367.5" font-size="11.2" fill="#555">Landmark (peak)</text>
  <text x="380" y="367.5" font-size="11.2" fill="#888">t* = mean landmark position (target)</text>
</svg>
